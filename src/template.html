/* ---------- Study Quest additions ---------- */
.center{text-align:center}
.logo{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.tagline{font-size:20px;margin-top:0}
.stack{display:grid;gap:12px}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff;font-size:14px;white-space:nowrap}
.chip.dark{background:var(--ink);color:#fff}
.meter{display:inline-flex;gap:2px}
.meter i{width:9px;height:14px;border:2px solid var(--ink);border-radius:3px;background:#fff}
.meter i.on{background:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
@media (max-width:780px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{padding:6px}
.board{position:relative}
.board svg{width:100%;height:min(62vh,520px);display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.board svg:active{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.hex.can{cursor:pointer}
.hex.can polygon{stroke-dasharray:6 4;stroke-width:4}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.pcard{border:2.5px solid var(--ink);border-radius:12px 6px 14px 5px;background:#fff;padding:6px 8px 8px;box-shadow:3px 3px 0 var(--ink);font-size:14px}
.pcard.me{outline:3px dashed var(--ink);outline-offset:3px}
.pcard.off{opacity:.55}
.pcard .top{display:flex;gap:6px;align-items:center}
.pcard b{font-size:15px}
.pips{letter-spacing:2px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.slot{width:46px;height:46px;border:2.5px solid var(--ink);border-radius:50% 46% 52% 48%;display:grid;place-items:center;font-size:20px;background:#fff;font-weight:bold}
.slot.ok{background:var(--ink);color:#fff}
.slot.spin{animation:spin .6s ease-out}
@keyframes spin{0%{transform:rotateX(0) scale(.6)}60%{transform:rotateX(540deg) scale(1.1)}100%{transform:rotateX(720deg) scale(1)}}
.reel{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.reel .r{border:2.5px solid var(--ink);border-radius:10px 4px 12px 4px;padding:6px 8px;min-width:96px;text-align:center;background:#fff;animation:spin .6s ease-out both}
.reel .r.ok{background:var(--ink);color:#fff}
.code{font-size:46px;letter-spacing:10px;font-weight:bold;line-height:1}
.timer{font-size:22px;font-weight:bold;min-width:46px;display:inline-block;text-align:right}
.foe{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.foe .info{flex:1;min-width:180px}
.cover{text-align:center;padding:36px 10px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

.ccard.sel{outline:3px dashed var(--ink);outline-offset:3px}
.ccard .sal{font-size:20px;font-weight:bold}
.ccard svg{float:right}
.plist{display:flex;flex-direction:column;gap:6px}

.log{font-size:13px;color:var(--mid);margin-top:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;z-index:9;font-size:15px;max-width:90vw}
.err{border:2.5px dashed var(--ink);padding:8px 12px;border-radius:10px;background:#fff;margin:8px 0}
.err li{margin:2px 0}
details summary{cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;gap:4px;align-items:center}
input.codein{text-transform:uppercase;letter-spacing:6px;font-size:22px;width:150px;text-align:center}
.spacer{height:10px}
.gearrow{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.gchip{font:inherit;font-size:12px;border:1.8px solid var(--ink);border-radius:8px;padding:1px 6px;background:#fff;color:var(--ink);cursor:pointer}
.gchip.none{border-style:dashed;color:var(--mid);cursor:default}

.gchip.t3{background:var(--ink);color:#fff}
.gearbtn.t2{border-width:3px}
.gearbtn.t3{outline:2.5px dashed var(--ink);outline-offset:2px}
.btn.on{background:var(--ink);color:#fff}
.calc{margin:12px 0 4px;max-width:300px;border:2.5px solid var(--ink);border-radius:14px 10px 16px 9px;background:#fff;box-shadow:3px 4px 0 var(--ink);padding:8px;transform:rotate(-.4deg)}
.calc .ct{font-size:13px;font-weight:bold;margin-bottom:6px}
.calc .cd{border:2px solid var(--ink);border-radius:8px 6px 9px 5px;padding:4px 8px;text-align:right;min-height:46px;background:#fbfaf5}
.calc .ce{font-size:14px;color:var(--mid);word-break:break-all;min-height:18px}
.calc .co{font-size:20px;font-weight:bold;min-height:24px}
.calc .ck{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.calc .ck button{font:inherit;font-size:17px;border:2px solid var(--ink);border-radius:9px 7px 10px 6px;background:#fff;color:var(--ink);padding:6px 0;cursor:pointer;box-shadow:1.5px 2px 0 var(--ink)}
.calc .ck button:active{transform:translate(1px,1px);box-shadow:none}
.calc .ck .op{background:#f1efe6}.calc .ck .eq{background:var(--ink);color:#fff}
.why{font-size:13px;margin:2px 0 8px 4px}

/* ============================================================

function roomCode() { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
const pick = (r, a) => a[Math.floor(r() * a.length)];

/* ---------- Compensation Ch 7–11 content (copied from Compémon) ---------- */
/*@@DATA@@*/

const ART = { body: Object.keys(BODY), ears: Object.keys(EARS), eyes: Object.keys(EYES).filter(k => k !== "ko"), mouth: Object.keys(MOUTH), pat: Object.keys(PAT), acc: Object.keys(ACC) };

const CLASS_ART = { hat: Object.keys(HATS), prop: Object.keys(PROPS) };

/* ============================================================
   PACKS
   ============================================================ */
const FX_OPS = { heal: "Heal", maxhp: "Max HP", shield: "Shield", focus: "Focus", gold: "Payroll", chaos: "Meter", dmgBuff: "Damage %", lives: "Lives", rounds: "Deadline + rounds", cut: "Enemy HP −%", reroll: "New question" };
const COMBAT_OPS = ["rounds", "cut", "reroll"]; // only usable while answering in a fight
const PERKS = { none: "No perk.", move: "+1 movement slot when rolling.", heal: "Heals the whole team 6 HP on each correct answer.", tough: "Takes 25% less damage.", focus: "+2 max focus. Gets 1 focus back after each win.",
  gold: "+10 Payroll after each win.", scout: "The team sees 1 room farther on the map.", shield: "Starts every fight with a shield (blocks 1 hit).", appeal: "Once per fight, the team's first wrong answer is overturned on appeal." };
const HIRE_OPS = { atk: "+N attack for everyone.", guard: "Blocks the first N hit(s) in every fight.", regen: "Heals the team N HP every round.", focus: "+N focus for everyone after each win.", gold: "+N Payroll after each win." };
const DEFAULT_HIRES = [
  { id: "temp", name: "Temp Accountant", cost: 50, fx: [{ op: "atk", n: 3 }], desc: "+3 attack for everyone.", art: { hat: "none", prop: "calculator" } },
  { id: "guard", name: "Security Guard", cost: 45, fx: [{ op: "guard", n: 1 }], desc: "Blocks the first hit in every fight.", art: { hat: "cap", prop: "phone" } },
  { id: "om", name: "Office Manager", cost: 40, fx: [{ op: "regen", n: 4 }], desc: "Heals the team 4 HP every round.", art: { hat: "bun", prop: "mug" } },
  { id: "ea", name: "Executive Assistant", cost: 40, fx: [{ op: "focus", n: 1 }], desc: "+1 focus for everyone after each win.", art: { hat: "headset", prop: "clipboard" } },
  { id: "intern", name: "Summer Intern", cost: 30, fx: [{ op: "gold", n: 12 }], desc: "+12 Payroll after each win.", art: { hat: "cap", prop: "mug" } }

/* ---------- economy ---------- */
const SIGN_ON = 20, BOUNTY_BASE = 15, BOUNTY_TIER = 8, BOUNTY_PER_RIGHT = 2; // start small; earn money by fighting and working
const TUTOR_PAY = 6, TUTOR_PART = 3;                                            // Employer 1-1: all choices right = $6 + 1 focus; 70%+ right = $3
const WORK_PAY = 8, WORK_PERFECT = 6, SHIFT_QS = 3;                        // Overtime Desk: 3 questions, $8 each, +$6 for 3/3
const PTO_ACCRUE = 20, PTO_ACCRUE_MAX = 2;                                 // +1 PTO day per 20 correct team answers, up to 2 a run
/* ---------- equipment: one weapon + one armor per player. Tier 1 = stats only; tiers 2–3 add study perks. ---------- */
const RARITY = ["", "Common", "Rare", "Epic"];
const GEAR = [
  { id: "mouse1", slot: "weapon", line: "Mouse", tier: 1, name: "Wired Mouse", cost: 35, atk: 1 },

  { id: "cas1", slot: "armor", line: "Business Casual", tier: 1, name: "Polo & Khakis", cost: 35, hp: 8 },
  { id: "cas2", slot: "armor", line: "Business Casual", tier: 2, name: "Quarter-Zip & Chinos", cost: 70, hp: 15, weak: 6, lean: 0.35 },
  { id: "cas3", slot: "armor", line: "Business Casual", tier: 3, name: "Blazer & Chinos", cost: 0, hp: 22, weak: 10, lean: 0.5, weakFocus: 1 },

const gearById = id => GEAR.find(g => g.id === id);
function gearText(g) {
  const s = [];
  if (g.atk) s.push(`+${g.atk} attack`); if (g.def) s.push(`${g.def}% less damage taken`); if (g.hp) s.push(`+${g.hp} max HP`); if (g.focus) s.push(`+${g.focus} max focus`);

const gearOf = (pl, slot) => pl.gear && pl.gear[slot] ? gearById(pl.gear[slot]) : null;
const gearSum = (pl, k) => ["weapon", "armor"].reduce((a, s) => { const g = gearOf(pl, s); return a + (g && g[k] ? g[k] : 0); }, 0);
const gearTag = g => `${"★".repeat(g.tier)} ${RARITY[g.tier]}`;

}
/* Short answers: each rubric line scores if any of its patterns appears (or `count` patterns × `each`). Under 12 words caps the score. */

function clientMsg(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "welcome") { ME = m.pid; UI.lost = false; UI.err = ""; }

  else if (m.t === "state") { S = m.s; NET.offset = Date.now() - m.now; UI.lost = false; render(); turnNotice(); }
  else if (m.t === "err") { UI.err = String(m.msg || "Error").slice(0, 200); render(); }
}
function leaveGame() {
  if (NET.mode === "client" && NET.conn && NET.conn.open) try { NET.conn.send({ t: "intent", a: { type: "LEAVE" } }); } catch (e) {}
  if (NET.mode !== "client") store.del("save");
  if (NET.peer) try { NET.peer.destroy(); } catch (e) {}
  Object.assign(NET, { mode: null, peer: null, conns: new Map(), conn: null, code: "" });

/* host + local autosave, so a reload can resume the run */
function save() {
  if (!S || (NET.mode !== "host" && NET.mode !== "local") || QS.has("test")) return;
  if (S.phase === "end") { store.del("save"); return; }

}
function resume() {
  const sv = store.get("save", null); if (!sv) return;

  if (!v.ok) { store.del("save"); loadDefault(); return toast("That saved run's pack is broken."); }

  if (sv.mode === "local") return startLocal(true);

    if (stop && i > steps / 2 && (stop === S.phase || (S.combat && S.combat.step === stop))) break;
  }
  const force = QS.get("force"); // screenshot hook: open a tile of this type for the active player
  if (force === "boss" && S.map) { const tl = S.map.tiles[S.map.dungeons[2]]; tl.progress = tl.rooms.length - 1; S.event = null; startCombat(S, tl.id, rr(S)); }
  else if (force && S.map) { const tl = Object.values(S.map.tiles).find(x => x.type === force); if (tl) { tl.done = false; S.phase = "map"; S.combat = null; S.event = null; trigger(S, tl, rr(S));
    const fill = QS.get("fill"); if (fill === "essay" && S.event) essayAnswer(S, S.event, S.players[S.event.pid], PACK.shortAnswers[S.event.sa].model.split(" ").slice(0, 40).join(" "), rr(S));
    if (QS.get("calcq") && S.event && S.event.q) S.event.q = prepQ({ ...IHRM_GENS[2].make(rr(S)), kind: "mc", c: "5", d: 3, id: "lockdemo" }, rr(S));
    if (fill === "tutor" && S.event) tutorAnswer(S, S.event, S.players[S.event.pid], [0, 1, 4]);
    if (fill === "work" && S.event) { const pl = S.players[S.event.pid]; shiftAnswer(S, S.event, pl, { i: S.event.qs[0].ans }, rr(S)); }
    if (QS.get("gear")) S.order.forEach((p, i) => { equip(S.players[p], ["mouse2", "notes3", "mouse1"][i % 3]); equip(S.players[p], ["pro2", "cas3", "smart1"][i % 3]); }); } }
  if (QS.get("show")) UI.shownFor = viewer();
  render();
  if (QS.get("press")) for (const k of QS.get("press").split(",")) { const b = document.querySelector(`[data-ck="${k}"]`); if (b) b.click(); } // screenshot hook: tap calculator keys
}

/* Online bot (?bot=1): plays this device's seat, for two-device tests. */
function onlineBot() {
  if (!S || !ME || UI.lost) return;
  const me = S.players[ME]; if (!me) return; const host = NET.mode === "host";
  if (S.phase === "lobby") { if (!me.cls) return dispatch({ type: "PICK", cls: PACK.classes[S.order.indexOf(ME) % PACK.classes.length].id }); if (host && S.order.length >= +(QS.get("players") || 2) && S.order.every(p => S.players[p].cls)) dispatch({ type: "START" }); return; }
  if (S.phase === "map" && active(S) === ME) {
    if (!S.roll) return dispatch({ type: "ROLL" });
    const to = S.moves > 0 && pathStep(S, [S.map.dungeons[Math.min(2, S.dcleared)]]); return dispatch(to ? { type: "MOVE", to } : { type: "END_MOVE" });
  }
  if (S.phase === "shop" && active(S) === ME) return dispatch({ type: "SHOP_DONE" });
  if (S.phase === "event" && S.event.pid === ME) { const E = S.event;
    if (E.done) return E.offer && !E.took ? dispatch({ type: "PICK_GEAR", i: 0 }) : dispatch({ type: "EVENT_DONE" });
    return E.kind === "essay" ? dispatch({ type: "ANSWER", text: "Test answer from the online bot about position filling, management development and organization development." }) : dispatch({ type: "ANSWER", i: 0 }); }
  if (S.phase === "combat") { const C = S.combat;
    if (C.step === "answer" && C.ans[ME] === undefined && C.qs[ME] && !C.qs[ME].hidden) return dispatch({ type: "ANSWER", i: host && C.qs[ME].ans != null ? C.qs[ME].ans : 0 });
    if (C.step === "reveal" && host) return dispatch({ type: "NEXT", round: C.round }); }
}
if (QS.has("bot")) { window.__sq = () => ({ S, ME, mode: NET.mode, status: NET.status, err: UI.err, lost: UI.lost, code: NET.code }); setInterval(onlineBot, 700); }
if (QS.get("name")) UI.name = QS.get("name");

/* ---------- boot ---------- */
loadDefault();
if (QS.has("test")) { let res; try { res = runTests(); } catch (e) { res = { crash: e.message, stack: String(e.stack) }; } app.innerHTML = `<pre id="testout">${esc(JSON.stringify(res, null, 1))}</pre>`; }
else if (QS.has("demo")) demo(+QS.get("demo") || 0);
else {
  const h = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1]; if (h) UI.joinCode = h.toUpperCase();
  if (QS.get("auto") === "host" && UI.name) startHost(); else if (QS.get("join") && UI.name) startClient(QS.get("join")); else render();
}
</script>
