/* ---------- built-in pack: MGMT 660 International Business Quest (IHRM Ch 4–7) ----------
   Written from the Chapter 4–7 lecture slides (Dowling, Festing & Engle, IHRM 8e).
   Also uses the predicted Exam 2 study guide in the Study Quest folder.
   Weighted toward the kinds of items on the Exam 1 review: named frameworks, lists,
   types/approaches, and advantages vs. disadvantages. Correct answer first; the game shuffles. */
const IHRM_QS = [];
const IM = (c, d, q, a, e, tbl) => IHRM_QS.push({ kind: "mc", c: String(c), d, q, a, e, tbl });
const IT = (c, d, q, tf, e) => IHRM_QS.push({ kind: "tf", c: String(c), d, q, tf, e });

/* ===== Chapter 4 — Global Work ===== */
IM(4, 1, "The taxonomy of global work experiences sorts global work along which three dimensions?", ["Cognitive flexibility, physical mobility, and non-work disruptions", "Salary, status, and seniority", "Language, culture, and religion", "Duration, cost, and family size"], "Ch 4 slide 2: global work differs in the cognitive flexibility it demands, how much physical moving it involves, and how much it disrupts life outside work.");
IM(4, 2, "A software tester flies from Ireland to a different EU country every few weeks for 1–3 month projects and never relocates her family. Which global worker is she?", ["Flexpatriate", "Corporate expatriate", "Inpatriate", "Global domestic"], "Flexpatriates take frequent short trips (usually 1–3 months), often to several countries, without family. (Table 4.2)");
IM(4, 2, "An engineer lives in Belgium and crosses the border to work in the Netherlands every weekday (or every week), returning home regularly. Which type of global worker is this?", ["International commuter", "Flexpatriate", "Self-initiated expatriate", "Short-term assignee"], "International commuters live in one country and work in another, commuting home regularly. (Ch 4 slides 3, 13)");
IM(4, 2, "A manager never leaves her home office in Chicago but spends her day dealing with suppliers and colleagues in Asia and Europe by video and email. What is she?", ["A global domestic", "A flexpatriate", "An international commuter", "A corporate expatriate"], "Global domestics do international work from home, with little or no travel. (Ch 4 slides 3, 13)");
IM(4, 2, "A nurse from the Philippines finds her own job in Dubai and moves there without any employer sending her. Which category fits?", ["Self-initiated expatriate", "Corporate expatriate", "Inpatriate", "Flexpatriate"], "Self-initiated expatriates (SIEs) choose and organize their own move abroad, rather than being sent by an employer. (Ch 4 slide 12)");
IM(4, 1, "Which global worker is sent by the parent company on an assignment of 12 months or more, usually with family?", ["Corporate (long-term) expatriate", "Short-term assignee", "Flexpatriate", "International business traveler"], "Table 4.2: corporate expatriates go for 12+ months, to one country, usually with family.");
IM(4, 2, "According to Table 4.2, what is the typical duration of a SHORT-TERM assignment?", ["3–12 months", "1–3 months", "12 months or more", "1–2 weeks"], "Short-term assignees: 3–12 months, in one or very few countries, usually without family.");
IM(4, 2, "According to Table 4.2, which assignment type has the HIGHEST risk of assignment failure and is the most cost-intensive?", ["Corporate (long-term) expatriates", "Short-term assignees", "Flexpatriates", "Global domestics"], "Long-term expatriation is cost-intensive and carries higher failure risk; flexpatriates have lower risk and no notable extra costs.");
IM(4, 2, "For which group does Table 4.2 say repatriation is 'challenging due to long-term planning issues'?", ["Corporate (long-term) expatriates", "Short-term assignees", "Flexpatriates", "International commuters"], "For short-term assignees and flexpatriates, repatriation is 'not a problem.'");
IM(4, 2, "According to Table 4.2, how often do flexpatriates usually receive pre-departure training?", ["Usually no", "Usually yes", "Sometimes", "Always, by law"], "Pre-departure training: corporate expatriates usually yes; short-term assignees sometimes; flexpatriates usually no.");
IM(4, 2, "Table 4.2: What is the IHRM department's role for corporate (long-term) expatriates compared with flexpatriates?", ["Responsible for all aspects of the assignment vs. less involvement", "Less involvement vs. responsible for all aspects", "No involvement in either case", "Equal involvement in both cases"], "The IHRM role is largest for long-term expatriates. Short-term assignees and flexpatriates get less involvement.");
IM(4, 3, "Table 4.2: Which statement about host-country language skills is correct?", ["Long-term expatriates often need at least basic skills; for flexpatriates they are not necessarily required", "Flexpatriates must be fluent; long-term expatriates need none", "All three types are required to be fluent", "Short-term assignees are forbidden to use the host language"], "Corporate: at least basic skills are often required. Short-term: basic skills are advantageous. Flexpatriates: not necessarily required.");
IM(4, 2, "Table 4.2: How important is adjustment to the host country for each type of assignee?", ["Very important (incl. family) for long-term; important for short-term; less important for flexpatriates", "Less important for long-term; very important for flexpatriates", "Equally unimportant for all three", "Important only for short-term assignees"], "Adjustment matters most when the assignment is long and the family comes too.");
IM(4, 3, "Table 4.2: Which feature is the SAME ('Yes') for corporate expatriates, short-term assignees, AND flexpatriates?", ["Boundary spanning", "Family relocation", "Pre-departure training", "Repatriation being challenging"], "All three types act as boundary spanners. Integration at the host location, by contrast, is only limited for flexpatriates.");
IM(4, 2, "Table 4.2: What are the typical individual motives of a corporate (long-term) expatriate?", ["Career advancement, attractive compensation packages, international experience", "Only individual development", "Avoiding family obligations", "Escaping a poor performance rating"], "Flexpatriates are motivated by international experience and individual development; short-term assignees by experience and career advancement.");
IM(4, 1, "What are the three purposes of expatriate assignments (Edström and Galbraith's classic list)?", ["Position filling, management development, and organization development", "Recruiting, selecting, and firing", "Cost cutting, tax avoidance, and outsourcing", "Training, appraisal, and repatriation"], "Ch 4 slide 8.");
IM(4, 2, "A firm sends an engineer to Brazil only because no local engineer has the technical skills to run the new plant. Which purpose of assignment is this?", ["Position filling", "Management development", "Organization development", "Global domestic work"], "Position filling = there is a gap in skills or qualified people at the subsidiary.");
IM(4, 2, "A high-potential manager is rotated to the Singapore subsidiary mainly so she gains international experience for future senior roles. Which assignment purpose is this?", ["Management development", "Position filling", "Organization development", "Flexpatriation"], "Management development builds the individual's skills and career. (Ch 4 slide 8; Ch 7 slide 2)");
IM(4, 2, "An MNE rotates managers through subsidiaries so it builds a shared corporate culture, coordination, and knowledge transfer across units. Which purpose is this?", ["Organization development", "Position filling", "Management development", "Inpatriation"], "Organization development serves the MNE: control, socialization, and a shared global mindset. (Ch 4 slide 8; Ch 7 slide 2)");
IM(4, 2, "Figure 4.1 shows six roles of the expatriate in the interplay of headquarters and the local unit. Which of these is NOT one of them?", ["Tax auditor", "Agent of direct control", "Language node", "Network builder"], "The six roles: agent of direct control, agent of socialization, network builder, transfer of competence and knowledge, boundary spanner, language node.");
IM(4, 2, "An expatriate translates between head-office English and the subsidiary's local language, so information flows both ways. Which Figure 4.1 role is this?", ["Language node", "Agent of direct control", "Agent of socialization", "Network builder"], "The language node role links the shared corporate language with the local language.");
IM(4, 2, "An expatriate makes sure the subsidiary follows headquarters' rules and reports. Which role in Figure 4.1 does this describe?", ["Agent of direct control", "Agent of socialization", "Boundary spanner", "Language node"], "Direct control = expatriates make sure headquarters' policies are followed.");
IM(4, 2, "An expatriate spreads the corporate values and culture to local staff so their behavior aligns informally with HQ. Which role is this?", ["Agent of socialization", "Agent of direct control", "Language node", "Position filler"], "Socialization is informal, normative control through shared values.");
IM(4, 2, "An expatriate collects information from the host environment and represents the firm to local stakeholders, crossing organizational boundaries. Which role is this?", ["Boundary spanner", "Language node", "Agent of direct control", "Network builder"], "Boundary spanners work across the boundary between the unit and its environment.");
IM(4, 1, "What is an INPATRIATE?", ["A host- or third-country national transferred into the parent-country (HQ) operations", "A parent-country national sent abroad", "A worker who commutes across a border each week", "An expatriate who has returned home"], "Inpatriation moves HCNs and TCNs into headquarters. (Ch 4 slide 10)");
IM(4, 2, "Which is one of the key drivers for recruiting and transferring inpatriate managers?", ["Building a culturally diverse top team that can 'think global and act local'", "Lowering every employee's salary", "Avoiding host-country career opportunities", "Reducing headquarters' international knowledge"], "Ch 4 slide 10: global core competency and diverse perspectives, career opportunities for high-potential HCNs, and difficult emerging-market locations.");
IM(4, 3, "Why do emerging markets help drive the use of inpatriates?", ["They are often difficult locations for expatriates in terms of quality of life and cultural adjustment", "They forbid all expatriates by law", "They have no high-potential local employees", "They pay higher salaries than headquarters"], "Ch 4 slide 10: inpatriates from those markets can bring local knowledge back without forcing PCNs into hard postings.");
IM(4, 1, "Traditionally, 'expatriate failure' was defined as what?", ["The premature return of an expatriate before the assignment ends", "Any expatriate who earns a bonus", "An expatriate who learns the local language", "A promotion after repatriation"], "Ch 4 slide 11: the classic definition was premature return. The text argues for a broader definition.");
IM(4, 2, "What does Chapter 4 recommend about the definition of expatriate failure?", ["Broaden it beyond premature return to subjective indicators such as career or life satisfaction", "Keep it limited to premature return only", "Stop measuring failure entirely", "Define failure only by the cost of the assignment"], "Ch 4 slide 11: numbers must be read with caution, and organizational and individual views may differ.");
IM(4, 2, "Which statement about self-initiated expatriates (SIEs) matches the slides?", ["Many organizations do not systematically track or manage them, though mid- to high-status SIEs often bring strong skills", "They are always low-status workers", "They are managed exactly like corporate expatriates", "They never have language skills"], "Ch 4 slide 12: SIEs often have strong education, language skills, an international mindset, and an entrepreneurial approach.");
IM(4, 2, "Table 4.1 compares global workers by status. Which group appears in ALL three status levels (low, mid, high)?", ["Migrants", "Corporate expatriates", "Flexpatriates", "Global virtual team members"], "Migrants are marked at low, mid, and high status. Corporate expatriates are mid/high only.", [["Type", "Low", "Mid", "High"], ["Corporate expatriates", "–", "X", "X"], ["Flexpatriates", "–", "X", "(X)"], ["Migrants", "X", "X", "X"], ["Global domestics", "X", "X", "(X)"]]);
IM(4, 3, "In Table 4.1, which TWO groups are NOT found at low status?", ["Corporate expatriates and flexpatriates", "Migrants and international commuters", "Self-initiated expatriates and global domestics", "International commuters and migrants"], "Low status is marked only for self-initiated expatriates, international commuters, global domestics, and migrants.");
IT(4, 2, "Flexpatriates usually relocate their families for the duration of each assignment.", false, "Flexpatriates travel without family. (Table 4.2)");
IT(4, 1, "Global virtual team members can do international work without physically relocating.", true, "They work across borders mainly through technology. (Ch 4 slide 13)");
IT(4, 2, "Short-term assignments are usually less cost-intensive than long-term expatriation.", true, "Table 4.2: organizational costs are 'less cost-intensive than long-term expatriation.'");
IT(4, 2, "The slides say numbers about expatriate failure rates are precise and can be taken at face value.", false, "Ch 4 slide 11: failure figures must be interpreted with caution.");
IT(4, 2, "Even though its definition is debated, presenting expatriate failure as a problem has had a positive effect on attention to expatriation practices.", true, "Ch 4 slide 11.");

/* ===== Chapter 5 — Staffing, Recruitment & Selection ===== */
IM(5, 1, "Which staffing approach fills key subsidiary positions mainly with parent-country nationals (PCNs)?", ["Ethnocentric", "Polycentric", "Geocentric", "Regiocentric"], "Ethnocentric: PCNs are favored for key positions. (Ch 5 slide 2)");
IM(5, 1, "Under which staffing approach do host-country nationals (HCNs) manage subsidiaries, while PCNs hold the top HQ jobs?", ["Polycentric", "Ethnocentric", "Geocentric", "Regiocentric"], "Polycentric: each subsidiary is treated as a distinct national entity run by HCNs.");
IM(5, 1, "Which staffing approach says ability matters more than nationality, so the best person is chosen for the job wherever they come from?", ["Geocentric", "Ethnocentric", "Polycentric", "Regiocentric"], "Geocentric = a worldwide approach to staffing.");
IM(5, 2, "A European MNE moves managers freely among its EU subsidiaries but rarely between Europe and Asia. Which approach is this?", ["Regiocentric", "Geocentric", "Ethnocentric", "Polycentric"], "Regiocentric is like geocentric, but limited to one region.");
IM(5, 2, "A firm uses a PCN to run its new Mexican plant so headquarters keeps tight control and the subsidiary follows MNE policies. Which advantage of PCNs is this?", ["Organizational control and coordination are maintained", "Hiring costs are reduced and no work permit is needed", "Salary requirements are lower than for PCNs", "Language barriers are eliminated"], "Table 5.1: PCN advantages include control and coordination, international experience for promising managers, special skills, and assurance of compliance.");
IM(5, 2, "Which is a DISADVANTAGE of using PCNs (Table 5.1)?", ["The promotional opportunities of HCNs are limited", "Control of headquarters may be impeded", "The host government may resent hiring them", "They have limited career opportunities outside the subsidiary"], "PCN disadvantages: limited HCN promotion, slow adaptation, an inappropriate HQ style, and different pay for PCNs and HCNs.");
IM(5, 2, "Which is an ADVANTAGE of using third-country nationals (TCNs)?", ["Salary and benefit requirements may be lower than for PCNs", "There is assurance the subsidiary complies with MNE policy", "No work permit is required", "Government policy usually requires hiring TCNs"], "Table 5.1: TCNs may cost less than PCNs and may know the host-country environment better.");
IM(5, 2, "Which is a DISADVANTAGE specific to TCNs in Table 5.1?", ["Transfers must consider possible national animosities (e.g., India and Pakistan)", "Language barriers are eliminated", "Continuity of management improves", "Promising managers gain international experience"], "TCN disadvantages also include host-government resentment and TCNs not wanting to return home.");
IM(5, 2, "Which is an ADVANTAGE of hiring host-country nationals (HCNs)?", ["Continuity of management improves, since HCNs stay longer in their positions", "Headquarters control is easier", "HCNs have broad career paths across the whole MNE", "PCNs gain more foreign experience"], "Table 5.1: HCNs also remove language barriers, reduce hiring costs, may be required by government, and improve HCN morale.");
IM(5, 2, "Which is a DISADVANTAGE of hiring HCNs?", ["It could encourage a federation of national rather than global units", "Language barriers increase", "Work permits become harder to get", "Hiring costs rise sharply"], "Table 5.1: HCN disadvantages include weaker HQ control, limited HCN careers outside the subsidiary, and fewer chances for PCNs to gain foreign experience.");
IM(5, 3, "A host government requires that foreign firms hire local managers. Which staffing group benefits, and which Table 5.1 point does this show?", ["HCNs — 'government policy may dictate hiring of HCNs'", "PCNs — 'assurance of compliance with MNE objectives'", "TCNs — 'better informed about the host environment'", "PCNs — 'promising managers gain international experience'"], "Government pressure is listed as an HCN advantage.");
IM(5, 2, "Figure 5.1 groups the determinants of staffing choices into four categories. Which is NOT one of them?", ["Shareholder dividend policy", "Context specificities", "Company specificities", "Local unit specificities"], "The four groups: context specificities, company specificities, local unit specificities, and IHRM practices.");
IM(5, 2, "In Figure 5.1, 'cultural context, institutional context, staff availability, and type of industry' belong to which group?", ["Context specificities", "Company specificities", "Local unit specificities", "IHRM practices"], "These are features of the external environment.");
IM(5, 2, "In Figure 5.1, 'establishment method, strategic role and importance, need for control, and locus of decision' belong to which group?", ["Local unit specificities", "Company specificities", "Context specificities", "IHRM practices"], "These describe the subsidiary itself (e.g., greenfield vs. acquisition).");
IM(5, 2, "In Figure 5.1, 'MNE structure and strategy, international experience, corporate governance, and organizational culture' belong to which group?", ["Company specificities", "Context specificities", "Local unit specificities", "IHRM practices"], "These are features of the MNE as a whole.");
IM(5, 2, "In Figure 5.1, selection, training and development, compensation, and career management are grouped as what?", ["IHRM practices", "Context specificities", "Company specificities", "Local unit specificities"], "IHRM practices also shape which staffing approach is possible.");
IM(5, 2, "How does international recruitment and selection usually differ from domestic recruitment and selection?", ["Fewer external recruits and a preference for internal recruitment", "More external recruits and no internal candidates", "Selection is based only on technical skills", "Recruitment is done only through agencies"], "Ch 5 slide 7: internal recruits reduce selection risk and protect present and past human capital investments.");
IM(5, 2, "Why do MNEs prefer internal candidates for international assignments?", ["To reduce selection risk and secure present and past human capital investments", "Because external candidates are illegal", "Because internal candidates never need training", "To avoid paying allowances"], "Ch 5 slide 7.");
IM(5, 2, "Figure 5.3 lists six factors in expatriate selection. Which three are INDIVIDUAL factors?", ["Technical ability, cross-cultural suitability, family requirements", "Country/cultural requirements, language, MNE requirements", "Salary, age, gender", "Technical ability, language, MNE requirements"], "Individual: technical ability, cross-cultural suitability, family requirements. Situational: country/cultural requirements, language, MNE requirements.");
IM(5, 2, "In Figure 5.3, which factor is on the SITUATION side of the selection decision?", ["MNE requirements", "Technical ability", "Cross-cultural suitability", "Family requirements"], "Situational factors: country/cultural requirements, language, MNE requirements.");
IM(5, 2, "Why is technical ability alone NOT enough to select an expatriate?", ["Cross-cultural suitability and family factors also affect whether the assignment succeeds", "Technical ability is never measured", "Expatriates do not do technical work", "Host countries ban technical tests"], "Figure 5.3: technical skill is necessary but not sufficient.");
IM(5, 2, "In the adjustment framework (Festing & Maletzky), what are the three parts, from left to right?", ["Antecedents → modes (strategies of adjustment) → outcomes", "Selection → training → appraisal", "Honeymoon → culture shock → recovery", "Input → output → feedback"], "Figure 5.4: antecedents (individual, job, organizational, non-work), modes (e.g., coping), and outcomes.");
IM(5, 2, "Which are the three adjustment OUTCOMES in Figure 5.4?", ["Interaction adjustment, work adjustment, general adjustment", "Psychological, physical, financial adjustment", "Ethnocentric, polycentric, geocentric adjustment", "Pre-departure, on-assignment, post-assignment"], "Each outcome has a psychological and a socio-cultural side.");
IM(5, 3, "In Figure 5.4, the ANTECEDENTS of adjustment are grouped into which categories?", ["Individual, job, organizational, non-work", "Technical, cultural, family, language", "Hard, soft, contextual", "Cognitive, affective, behavioral"], "Non-work antecedents include family and spouse factors.");
IM(5, 2, "Which is one of the IHRM solutions for dual-career couples listed in the slides?", ["Inter-firm networking and job-hunting assistance for the partner", "Requiring the partner to stay home", "Paying the expatriate less", "Refusing all assignments to couples"], "Ch 5 slide 10 also lists work-life support, lessons from Covid-19, managerial support, intra-firm employment, and compensation and benefits.");
IM(5, 2, "An MNE finds the trailing spouse a job inside one of its own subsidiaries in the host country. Which dual-career solution is this?", ["Intra-firm employment", "Inter-firm networking", "Job-hunting assistance", "Managerial support"], "Intra-firm = inside the same MNE. Inter-firm = through other companies' networks.");
IM(5, 2, "Table 5.6 (expatriate glass ceiling): which is a PRE-ASSIGNMENT strategy for MNEs?", ["Review selection criteria and remove gender biases from the selection process", "Fulfill the psychological contract after return", "Continue training and mentoring on assignment", "Consider short-term assignments"], "Pre-assignment strategies for MNEs: review criteria, remove bias, train decision-makers, address dual-career issues, and add women to networks.");
IM(5, 3, "Table 5.6: which is a POST-ASSIGNMENT strategy for MNEs?", ["Fulfill the psychological contract — continued mentoring and chances to use new expertise", "Eliminate gender bias in selection", "Assign women to countries where they can adjust quickly", "Develop short-term assignment options"], "On-assignment: country choice, short-term options, mentoring. Post-assignment: honor the psychological contract.");
IM(5, 2, "Table 5.6: for female expatriates ON assignment, what is described as a key to success?", ["Finding and using mentors, and absorbing knowledge from local settings", "Avoiding all local networks", "Refusing short-term assignments", "Relying only on headquarters' instructions"], "Mentors appear in both pre- and on-assignment strategies.");
IM(5, 2, "In an intercultural assessment-center role play (Table 5.5), a candidate assumes the business partner's lateness was unintended and does not compare it with home-country habits. Which dimension shows HIGH competence?", ["Non-judgmentalism", "Flexibility", "Tolerance for ambiguity", "Learning orientation"], "Low non-judgmentalism = assuming lateness is intended and praising home-country punctuality.");
IM(5, 2, "Table 5.5: a candidate stays patient and shows a sense of humor in a confusing situation. Which dimension shows high competence?", ["Tolerance for ambiguity", "Empathy", "Interpersonal skills", "Flexibility"], "Low tolerance for ambiguity = impatient, very serious.");
IM(5, 2, "Table 5.5: when a meeting stalls, a candidate changes the subject and suggests a new meeting. Which dimension shows high competence?", ["Flexibility", "Non-judgmentalism", "Empathy", "Learning orientation"], "Low flexibility = repeating continuously, talking about wasted opportunities.");
IM(5, 3, "Table 5.5: a candidate speaks immediately about business and says 'goodbye' quickly. This shows LOW competence on which dimension?", ["Interpersonal skills", "Tolerance for ambiguity", "Learning orientation", "Flexibility"], "High interpersonal skills = using the time for a short conversation and speaking about oneself or private matters.");
IM(5, 2, "Table 5.5: a candidate asks to clarify unclear issues and takes the other side's arguments into account. Which dimension is this?", ["Learning orientation", "Empathy", "Non-judgmentalism", "Tolerance for ambiguity"], "Low learning orientation = not asking for clarification or ignoring the partner's point.");
IT(5, 1, "Under a geocentric staffing approach, nationality matters more than ability.", false, "Geocentric = ability matters more than nationality.");
IT(5, 2, "One disadvantage of TCNs is that they may not want to return to their home country after the assignment.", true, "Table 5.1.");
IT(5, 2, "Hiring HCNs limits opportunities for PCNs to gain foreign experience.", true, "Table 5.1, HCN disadvantages.");
IT(5, 2, "A disadvantage of PCNs is that compensation for PCNs and HCNs may differ, which can create tension.", true, "Table 5.1, PCN disadvantages.");
IT(5, 2, "International recruitment typically uses MORE external recruits than domestic recruitment.", false, "It uses fewer external recruits and prefers internal candidates. (Ch 5 slide 7)");

/* ===== Chapter 6 — Global Performance Management ===== */
IM(6, 2, "Which is one of the MNE performance management constraints in the slides?", ["Whole vs. part", "Ethnocentric staffing", "Dual-career couples", "Language training"], "Ch 6 slide 3: whole vs. part, non-comparable data, volatility, separation by time and distance, and variable market maturity.");
IM(6, 2, "A subsidiary looks unprofitable on paper, but it exists to block a competitor in its home market, which helps the MNE overall. Which constraint does this show?", ["Whole vs. part", "Non-comparable data", "Volatility of the environment", "Separation by time and distance"], "A unit's results must be judged by its role in the MNE's global strategy, not in isolation.");
IM(6, 2, "Sales and productivity figures from a subsidiary in Germany can't be compared directly with ones from Brazil because of different accounting rules, labor laws, and markets. Which constraint is this?", ["Non-comparable data", "Whole vs. part", "Variable levels of maturity", "Separation by time and distance"], "Data from different countries often can't be compared like-for-like.");
IM(6, 2, "Sudden currency swings, political instability, and new trade rules make long-term subsidiary goals unrealistic. Which constraint is this?", ["Volatility in the global business environment", "Whole vs. part", "Non-comparable data", "Separation by time and distance"], "Ch 6 slide 3.");
IM(6, 2, "Headquarters managers are 10 time zones away and rarely visit, which makes it hard to judge subsidiary performance. Which constraint is this?", ["Separation by time and distance", "Volatility", "Whole vs. part", "Non-comparable data"], "Ch 6 slide 3.");
IM(6, 3, "A new subsidiary in an emerging market can't be held to the same targets as a 30-year-old subsidiary in a mature market. Which constraint is this?", ["Variable levels of maturity across markets", "Whole vs. part", "Volatility", "Separation by time and distance"], "Ch 6 slide 3: comparative data must be relevant to each market's stage.");
IM(6, 2, "Figure 6.2 (MNE control and performance): formal and informal control activities focus on which three things?", ["Standardization of practices, socialization, and compliance with norms/values", "Hiring, firing, and promotion", "Language, religion, and politics", "Taxes, tariffs, and exchange rates"], "These lead to a global mix of strategic outcomes for HQ and the subsidiary.");
IM(6, 2, "Figure 6.3 lists five variables affecting expatriate performance. Which is NOT one of them?", ["The expatriate's age", "The compensation package", "Headquarters' support", "Cultural adjustment of self and family"], "The five: compensation package, task, headquarters' support, host environment, cultural adjustment (self and family).");
IM(6, 2, "An expatriate performs poorly mainly because his spouse and children are unhappy and unsettled in the host country. Which Figure 6.3 variable is at work?", ["Cultural adjustment — self and family", "Task", "Compensation package", "Headquarters' support"], "Family adjustment is part of the outermost layer in Figure 6.3.");
IM(6, 2, "Which type of international assignment is short-term knowledge transfer, with little cultural adjustment needed?", ["Technical", "Developmental", "Strategic", "Functional"], "Ch 6 slide 7.");
IM(6, 2, "An assignment focused on in-country performance and the assignee's own learning of local conditions (often part of a career program) is which type?", ["Developmental", "Technical", "Strategic", "Functional"], "Developmental = in-country performance plus local understanding for the assignee.");
IM(6, 2, "A high-profile assignment to open a new market, mainly to build the manager's global perspective, is which type?", ["Strategic", "Technical", "Functional", "Developmental"], "Strategic = high-profile activities for developing a global perspective.");
IM(6, 3, "Which assignment type involves a more enduring two-way transfer of existing processes and practices between HQ and the subsidiary?", ["Functional", "Technical", "Developmental", "Strategic"], "Functional assignments need more cultural adjustment because the assignee works closely with locals.");
IM(6, 2, "In the PCN role conception model (Figure 6.4), who is the ROLE SENDER that communicates the role conception to the PCN manager?", ["The multinational (headquarters)", "Host-country stakeholders only", "The PCN's family", "The local union"], "Host-country stakeholders are also role senders, across a cultural boundary.");
IM(6, 3, "How does the TCN role conception (Figure 6.5) differ from the PCN role conception (Figure 6.4)?", ["The TCN faces TWO cultural boundaries — between the parent company and themself, and with host-country stakeholders", "The TCN faces no cultural boundary at all", "The TCN receives no role conception from the parent", "The TCN is the role sender"], "TCNs come from neither the parent nor the host country, so role expectations cross more boundaries.");
IM(6, 2, "Why does the role conception model matter for appraising expatriates?", ["Role expectations from HQ and from host stakeholders can conflict across a cultural boundary, so behavior HQ expects may look wrong locally", "It shows that expatriates have no role conflict", "It removes the need for local input", "It applies only to domestic employees"], "Role conflict and ambiguity can make performance hard to judge fairly.");
IM(6, 2, "Which is a performance management challenge for NON-expatriates (e.g., flexpatriates, commuters, virtual team members)?", ["Isolating the international dimensions of job performance is not as straightforward", "They never work across borders", "Their performance is always easy to measure", "They are only appraised by HQ"], "Ch 6 slide 10 also lists cultural differences in criteria, outside appraisers, unclear rewards, and impact on HCN co-workers.");
IM(6, 1, "What are the three types of criteria (goals) used in appraising expatriate performance?", ["Hard, soft, and contextual goals", "Ethnocentric, polycentric, and geocentric goals", "Technical, developmental, and strategic goals", "Short, medium, and long goals"], "Ch 6 slide 11.");
IM(6, 2, "Return on investment, market share, and sales growth are examples of which goal type?", ["Hard goals", "Soft goals", "Contextual goals", "Developmental goals"], "Hard goals are objective, quantifiable, and directly measurable.");
IM(6, 2, "Leadership style and interpersonal skills are examples of which goal type?", ["Soft goals", "Hard goals", "Contextual goals", "Functional goals"], "Soft goals are relationship- or trait-based and harder to measure.");
IM(6, 3, "Which goal type tries to account for situational factors outside the expatriate's control, like local market conditions?", ["Contextual goals", "Hard goals", "Soft goals", "Strategic goals"], "Contextual goals take the performance context into account.");
IM(6, 2, "Which is one of the key questions around international performance appraisal in the slides?", ["Who conducts the appraisal — host managers, home managers, or both?", "What is the expatriate's favorite food?", "Should appraisals ever be done?", "Which currency is the salary paid in?"], "Ch 6 slide 12: who appraises, standardized vs. customized forms, frequency, how to give feedback, and cultural applicability.");
IM(6, 3, "Why might a host-country manager and a home-country manager rate the same expatriate differently?", ["The host manager sees daily behavior but through a local cultural lens; the home manager is distant and may miss local context", "They always use the same criteria and so cannot differ", "Home managers see more daily behavior", "Host managers never rate expatriates"], "This is why many firms combine raters.");
IM(6, 2, "In the strategic global performance management cycle (Figure 6.6), what are the four steps of TRANSFORMATION?", ["Funneling, summation, conversion, sharpening", "Planning, doing, checking, acting", "Selection, training, appraisal, reward", "Hard, soft, contextual, strategic"], "Phase II of the GPM cycle (Engle, Festing & Dowling).");
IM(6, 3, "In Figure 6.6, 'Strategic actions' (Phase III) include decisions at which levels?", ["Organizational, unit, and individual", "Local, regional, and global only", "Hard, soft, and contextual", "Technical, functional, and strategic"], "Results are transformed, reported and reviewed, then acted on at all three levels, followed by revisions to GPM systems (Phase IV).");
IM(6, 2, "In Figure 6.1, which are listed as ORGANIZATIONAL outcomes of MNE performance management?", ["Control, reputation, and legal compliance", "Training, career implications, and financial consequences", "Funneling and sharpening", "Language and culture"], "Individual outcomes = training, career implications, financial consequences.");
IM(6, 2, "In Figure 6.1, which are listed as INDIVIDUAL outcomes?", ["Training, career implications, financial consequences", "Control, reputation, legal compliance", "Standardization and socialization", "Whole vs. part"], "Figure 6.1.");
IM(6, 3, "Figure 6.1 lists 'critical issues' in MNE performance management. Which set is correct?", ["Criteria (implicit/explicit; person vs. activities vs. outcomes), purposes (developmental, pay), tasks/roles, timing", "Ethnocentric, polycentric, geocentric, regiocentric", "Funneling, summation, conversion, sharpening", "Language, family, technical ability"], "Figure 6.1.");
IT(6, 2, "A standardized global appraisal form always works equally well in every culture.", false, "Ch 6 slide 12 raises the question of cultural applicability; formats may need customizing.");
IT(6, 2, "Hard goals are usually easier to measure objectively than soft goals.", true, "Hard = quantifiable; soft = relationship or trait based.");
IT(6, 2, "Technical assignments usually require MORE cultural adjustment than functional assignments.", false, "Technical assignments are short-term knowledge transfer; functional ones involve enduring two-way transfer with locals.");
IT(6, 2, "In Figure 6.3, headquarters' support is one of the variables that affects expatriate performance.", true, "Figure 6.3.");
IT(6, 2, "Performance criteria can be subject to cultural differences, which complicates appraisal of non-standard international work.", true, "Ch 6 slide 10.");

/* ===== Chapter 7 — International Training, Development & Careers ===== */
IM(7, 2, "Which is an ORGANIZATIONAL development outcome of international assignments?", ["The MNE accumulates knowledge and abilities and gains a global mindset", "The individual gets a personal tax refund", "The expatriate avoids promotion", "HCNs lose access to training"], "Ch 7 slide 2: the MNE also gains direct control and socialization, which helps knowledge and competence transfer.");
IM(7, 2, "Which is a MANAGEMENT development outcome of international assignments?", ["Individuals gain experience and advance careers; the MNE gets a cadre of experienced international operators", "The MNE accumulates patents", "Host governments gain tax revenue", "The firm reduces its number of subsidiaries"], "Ch 7 slide 2.");
IM(7, 2, "How do expatriates serve as part of a training and development tool (Ch 7 slide 3)?", ["They train HCNs, ensure systems are adopted, and are themselves managers under development", "They replace all local trainers permanently", "They only monitor travel expenses", "They avoid contact with HCNs"], "Expatriates are trainers, ensure adoption, and develop through job rotation.");
IM(7, 2, "Which is one of the essential components of pre-departure training?", ["Preliminary visits", "Exit interviews", "Stock option grants", "Performance calibration"], "Ch 7 slide 5: cultural awareness programs, preliminary visits, language training, practical day-to-day help, and security briefings.");
IM(7, 2, "A company sends the expatriate and spouse to the host city for a week before the move to look at housing and schools. Which pre-departure component is this?", ["Preliminary visit", "Cultural awareness program", "Security briefing", "Language training"], "Preliminary visits give a first-hand look and help the family decide and prepare.");
IM(7, 2, "Help with finding housing, schools, and a bank account in the host country is which pre-departure component?", ["Practical assistance with day-to-day matters", "Cultural awareness program", "Preliminary visit", "Security briefing"], "Ch 7 slide 5.");
IM(7, 2, "Mendenhall and Oddou's model links which three keys of cross-cultural training (CCT)?", ["Training methods, levels of training rigor, and duration of training — matched to expected interaction and culture novelty", "Salary, bonus, and benefits", "Hard, soft, and contextual goals", "Recruitment, selection, and placement"], "Ch 7 slide 6.");
IM(7, 2, "In the Mendenhall–Oddou model, 'culture novelty' means what?", ["How different the host culture is from the expatriate's native culture", "How new the employee is to the firm", "How recently the subsidiary was opened", "How many languages the employee speaks"], "Ch 7 slide 6.");
IM(7, 2, "An employee will spend 3 weeks in a culture similar to home, with low interaction with locals. Which CCT approach fits best?", ["Information-giving approach", "Affective approach", "Immersion approach", "No training is ever useful"], "Information-giving: low rigor, under 1 week, area/cultural briefings, films and books, survival-level language. (Ch 7 slide 8)");
IM(7, 2, "Which CCT approach uses role-playing, critical incidents, culture assimilator training, case studies, and stress reduction training?", ["Affective approach", "Information-giving approach", "Immersion approach", "Preliminary-visit approach"], "Affective: moderate rigor, 1–4+ weeks, for 2–12 month stays with some interaction. (Ch 7 slide 9)");
IM(7, 2, "Which CCT approach uses assessment centers, field experiences, simulations, sensitivity training, and extensive language training?", ["Immersion approach", "Affective approach", "Information-giving approach", "Survival approach"], "Immersion: high rigor, 1–2+ months, for 1–3 year stays with high interaction in a novel culture. (Ch 7 slide 10)");
IM(7, 3, "A manager will live in a very unfamiliar culture for 2 years and work closely with locals every day. What CCT approach and training length fit Mendenhall et al.'s model?", ["Immersion, about 1–2+ months of training", "Information-giving, less than a week", "Affective, 1–4 weeks", "No training needed for long stays"], "High interaction plus high culture novelty calls for high rigor.");
IM(7, 3, "In the Mendenhall–Dunbar–Oddou CCT figure, what length of training goes with the AFFECTIVE approach?", ["1–4 weeks", "Less than a week", "1–2 months or more", "1–3 years"], "Information-giving < 1 week; affective 1–4 weeks; immersion 1–2+ months.", [["Approach", "Rigor", "Training length", "Length of stay"], ["Information-giving", "Low", "?", "1 month or less"], ["Affective", "Moderate", "?", "2–12 months"], ["Immersion", "High", "?", "1–3 years"]]);
IM(7, 2, "Which study listed in the slides was a META-ANALYSIS of the cross-cultural training literature?", ["Morris and Robie", "Brookfield surveys", "Eschbach et al.", "Mendenhall and Oddou"], "Brookfield = self-evaluated survey responses; Eschbach et al. = measured cognitive, affective, and experiential CCT and language training. (Ch 7 slide 11)");
IM(7, 2, "Which is one of the reasons networked MNEs use international teams (Ch 7 slide 12)?", ["To foster innovation, learning, and knowledge transfer and break down functional and national boundaries", "To avoid any shared values", "To centralize every decision at HQ", "To reduce information flows"], "Teams also encourage diverse decision-making, develop a global perspective, and build shared values (normative control).");
IM(7, 2, "In Figure 7.2, international assignments feed into which outcomes?", ["Individual development, an international 'cadre,' and international (and virtual) teams — all leading to organizational development", "Only cost reduction", "Only repatriation", "Only host-country tax revenue"], "Figure 7.2.");
IM(7, 2, "Which is a training and development TREND noted in the slides?", ["Host countries continue to pressure for local training and development", "NGOs are becoming less important", "Interest in T&D focused on China is declining", "National context no longer matters to learning"], "Ch 7 slide 14.");
IM(7, 1, "Figure 7.3 ('Expatriation includes repatriation') shows which sequence?", ["Recruitment & selection → pre-departure training → on-assignment → re-entry or reassignment", "Hiring → firing → rehiring", "Training → appraisal → bonus", "Arrival → vacation → retirement"], "Repatriation is part of the expatriation cycle, and re-entry can loop back to a new assignment.");
IM(7, 2, "In Figure 7.4, which is a PRE-DEPARTURE repatriation practice?", ["A sponsor is assigned", "Home leave", "Rituals to share experience", "New assignment"], "Pre-departure: sponsor, communication protocols, web/media contacts, pre-departure training and orientation.");
IM(7, 2, "In Figure 7.4, which is a DURING-ASSIGNMENT repatriation practice?", ["Home leave and ongoing communication with the sponsor", "Assigning a sponsor for the first time", "Organizational reconnection", "Rituals or ceremonies to share experience"], "During assignment: home leave, work-related information exchanges, communication with the sponsor, systematic pre-return orientation.");
IM(7, 2, "In Figure 7.4, which is an UPON-RETURN practice?", ["Organizational reconnection and assistance with non-work factors", "Pre-departure orientation", "Communication protocols", "Home leave"], "Upon return: new assignment, organizational reconnection, help with non-work factors, rituals to share the experience.");
IM(7, 2, "What does Figure 7.4 call the shock an expatriate feels when coming HOME?", ["Culture shock back (reverse culture shock)", "Culture shock out", "Honeymoon shock", "Sticker shock"], "Culture shock out happens on departure; culture shock back happens on return. The goal is a balanced, integrated global perspective.");
IM(7, 2, "In Figure 7.5, career anxiety (loss of visibility, no post-assignment guarantee, workplace changes) is which kind of factor in repatriate adjustment?", ["Job-related factor", "Social factor", "Family factor", "Host-country factor"], "Job-related factors also include work adjustment, coping with new role demands, and loss of status and pay.");
IM(7, 2, "Which is a SOCIAL factor influencing repatriate adjustment (Figure 7.5)?", ["Effect on the partner's career", "Re-entry position", "Loss of status and pay", "Devaluing experience"], "Social factors: family adjustment, social networks, effect on the partner's career.");
IM(7, 2, "A repatriate returns to find her new job uses none of her international skills and her experience is ignored. Which Figure 7.5 factor is this?", ["Work adjustment — devaluing experience / re-entry position", "Social networks", "Family adjustment", "Culture shock out"], "Work adjustment covers the re-entry position, the employment relationship, and devaluing experience.");
IM(7, 2, "In Figure 7.6, the repatriation process links to which outcomes?", ["Staff availability and retention, employment relationship, organizational commitment, knowledge sharing", "Higher tariffs and taxes", "Ethnocentric staffing", "Hard and soft goals"], "The value the firm places on international experience shapes how it manages repatriation.");
IM(7, 2, "Which of these is 'market-specific knowledge' gained from an international assignment?", ["Knowledge of local political, social, and economic systems, language, and customs", "Self-confidence and tolerance", "Project management skills", "Exposure to other parts of the organization"], "Ch 7 slide 19: also personal skills, job-related management skills, network knowledge, and general management capacity.");
IM(7, 2, "A repatriate came back more self-confident, flexible, and tolerant. Which knowledge/skill category is this?", ["Personal skills", "Market-specific knowledge", "Network knowledge", "General management capacity"], "Personal skills = intercultural knowledge, self-confidence, flexibility, tolerance.");
IM(7, 2, "Broader job responsibilities and exposure to other parts of the organization build which capability?", ["General management capacity", "Market-specific knowledge", "Personal skills", "Network knowledge"], "Ch 7 slide 19.");
IM(7, 2, "Which topic is covered by a repatriation program (Table 7.3)?", ["Reverse culture shock, including family disorientation", "Hofstede's cultural dimensions", "The GLOBE study", "Mergers and acquisitions"], "Table 7.3 also covers relocation, financial and tax help, re-entry position, schooling, workplace changes, stress management, and networking.");
IM(7, 2, "Under Table 7.3, 'financial and tax assistance' specifically mentions which issue?", ["Loss of the overseas allowance and changes in benefits and taxes", "Stock market investing", "Payroll for HCNs", "Host-country minimum wage"], "Repatriates often take a pay drop when allowances end.");
IM(7, 2, "Which is one of the strategies for smooth re-entry?", ["Written repatriate agreements clarifying available assignments upon return", "Cutting all contact during the assignment", "Promising nothing about the return job", "Ending mentoring the day the expatriate leaves"], "Ch 7 slide 21 also lists briefings, career planning sessions, mentoring after return, home visits, reorientation, financial advice, an adjustment period, and visible signs of the repatriate's value.");
IM(7, 3, "A firm wants repatriates to stay after returning. Which combination best fits the slides' re-entry strategies?", ["Mentoring that continues after return, multiple career planning sessions, and visible expressions of the repatriate's value", "A surprise new job with no planning", "Ending the expatriate allowance early with no explanation", "Keeping the repatriate isolated to readjust alone"], "Ch 7 slide 21.");
IT(7, 2, "The information-giving approach is the most rigorous form of cross-cultural training.", false, "It is the least rigorous (low rigor, under a week).");
IT(7, 2, "Repatriation is part of the expatriation process, not a separate event after it.", true, "Figure 7.3: expatriation includes repatriation.");
IT(7, 2, "Loss of status and pay is a job-related factor that can make repatriate adjustment harder.", true, "Figure 7.5.");
IT(7, 2, "Security briefings are one of the essential components of pre-departure training.", true, "Ch 7 slide 5.");
IT(7, 2, "In Mendenhall and Oddou's model, a higher expected degree of interaction and greater culture novelty call for more rigorous and longer training.", true, "Ch 7 slides 6–10.");
IT(7, 2, "International teams can act as informal, normative control by developing shared values through socialization.", true, "Ch 7 slide 12.");

IM(4, 3, "Compare a corporate expatriate with a flexpatriate on the taxonomy of global work. Which is correct?", ["Corporate expatriate: highest non-work disruption (family moves); flexpatriate: highest physical mobility (frequent trips)", "Corporate expatriate: highest physical mobility; flexpatriate: highest non-work disruption from relocating the family", "Both have identical scores on all three dimensions", "Flexpatriates need no cognitive flexibility at all"], "After one move, an expatriate's mobility is low, but family disruption is high. Flexpatriates travel constantly; their family disruption is repeated absences, not relocation. (Study guide, Ch 4)");
IM(4, 2, "What kind of HR support do flexpatriates need most, given their global work profile?", ["Travel-health, work-life, and scheduling support — often ignored by firms", "Family relocation and school search", "Immersion-level language training", "A formal repatriation program"], "Match support to the profile: expatriates need family/relocation help; flexpatriates need help with the travel load. (Study guide, Ch 4)");
IM(4, 3, "(text) Harzing gives the expatriate control roles animal names. Which pairing is right?", ["Bears = direct control; bumble-bees = socialization (cross-pollinating culture); spiders = network building", "Bears = networks; spiders = direct control; bumble-bees = language", "Bumble-bees = direct control; bears = socialization", "Spiders = boundary spanning; bears = knowledge transfer"], "Harzing's metaphor (text — check your book). (Study guide, Ch 4)");
IM(4, 3, "A firm has just acquired a foreign subsidiary. Which expatriate roles should come FIRST?", ["Direct control (compliance, reporting, integration), then socialization and knowledge transfer", "Only network building, from day one", "Language node only", "No expatriate roles are needed after an acquisition"], "Control first, then culture and systems. Over time move toward network building and boundary spanning so local managers can take over. (Study guide, Ch 4)");
IM(4, 2, "(text) What is the MOST cited cause of expatriate failure?", ["The partner's (spouse's) inability to adjust", "The expatriate's lack of technical skill", "Too much pay", "The host country's weather"], "Other causes: family issues, the manager's own poor adjustment, job dissatisfaction. (Study guide, Ch 4 — text)");
IM(4, 3, "(text) Why did Harzing call high expatriate failure rates a 'myth'?", ["The widely quoted high rates came from old, poorly sourced studies", "Expatriates never return early", "Failure rates are secret by law", "Only flexpatriates fail"], "The slides agree: failure numbers must be interpreted with caution. (Study guide, Ch 4)");
IM(4, 3, "Which is a reason premature return is TOO NARROW as a definition of expatriate failure?", ["An expatriate who stays but underperforms, or quits soon after repatriation, also failed — and some early returns are successes", "Premature return never happens", "It counts too many successful expatriates as failures only", "It includes repatriation turnover already"], "Broaden the definition and add subjective indicators such as career and life satisfaction. (Study guide, Ch 4)");
IM(4, 2, "Which is an INDIRECT cost of expatriate failure?", ["Lost relationships, market share, reputation, and HCN morale", "Relocation expenses", "The expatriate's salary", "The cost of a replacement's flight"], "Direct costs: relocation, salary, replacement. Indirect: relationships, market share, reputation, morale. (Study guide, Ch 4)");
IM(4, 2, "(text) Which is a challenge that inpatriates face?", ["Adjusting to the HQ culture as a minority, sometimes seen as lower status, and feeling like an outsider in two places", "They never need to adjust", "They always receive the highest status at HQ", "They have no return or next-role planning issues"], "The firm must also plan the inpatriate's return or next role. (Study guide, Ch 4 — text)");
IM(4, 2, "How are self-initiated expatriates usually employed, compared with assigned expatriates?", ["On a local contract, with no expatriate package and no planned repatriation", "On a full expatriate package with a guaranteed return job", "Only as flexpatriates", "Only by their home-country employer"], "SIEs are a lower-cost source of global skills — if the firm tracks and manages them. (Study guide, Ch 4)");
IM(4, 3, "In Table 4.1, what is a HORIZONTAL comparison?", ["Comparing status levels (low, mid, high) within one type of global worker", "Comparing different types of global workers", "Comparing countries", "Comparing salaries across firms"], "Vertical = across types of global workers. (Study guide, Ch 4)");
IM(4, 3, "Mini-case: a Houston firm must install an ERP module at its Monterrey subsidiary over six weeks. Which global worker fits best?", ["Flexpatriate (technical transfer, family stays home, low cost)", "Corporate long-term expatriate with family", "Inpatriate", "Global domestic only"], "If the work ran past ~3 months, a short-term assignee would fit. (Study guide mini-case)");
IM(4, 3, "Mini-case: the same firm needs a general manager for its São Paulo subsidiary for three years, and no strong Brazilian HCN exists. What fits best?", ["Corporate (long-term) expatriate with family support, immersion CCT, and a repatriation plan from day one", "Flexpatriate with monthly visits", "Global virtual team member", "International commuter from Houston"], "Highest cost and failure risk, but needed for control and development. (Study guide mini-case)");
IM(4, 3, "Mini-case: coordinating a product launch in five EU countries with monthly site visits for a year fits which approach?", ["International business traveler/flexpatriate plus a global virtual team, with contextual appraisal goals", "One long-term expatriate in each country", "Inpatriates only", "Polycentric HCN hiring only"], "The home office stays the base; give work-life support for the travel load. (Study guide mini-case)");
// Ch 5
IM(5, 2, "(text) Ethnocentric, polycentric, geocentric, and regiocentric orientations are associated with which author?", ["Perlmutter", "Hofstede", "Edström & Galbraith", "Mendenhall & Oddou"], "EPRG — firms often mix orientations by function and subsidiary. (Study guide, Ch 5 — text)");
IM(5, 2, "Ethnocentric staffing fits best when…", ["The firm is early in internationalizing, needs strong control, or must protect key technology", "The firm follows a multidomestic strategy with high local responsiveness", "The firm wants a transnational strategy with global learning", "The firm runs a regional HQ for the EU"], "Main risk: HCN resentment, a 'glass ceiling' for locals, poor local fit. (Study guide, Ch 5)");

/* ---------- lockpick (chest) calculators: technical look-ups with numbers ---------- */
const IHRM_GENS = [];
const IG = (c, make) => IHRM_GENS.push({ c, d: 3, make });
const iRp = (r, a) => a[Math.floor(r() * a.length)];
IG(4, r => {
  const m = iRp(r, [1, 2, 4, 5, 7, 9, 11, 14, 18, 24, 36]), ans = m >= 12 ? "Corporate (long-term) expatriate" : m >= 3 ? "Short-term assignee" : "Flexpatriate";
  return { q: `Using Table 4.2, an assignee will spend ${m} month${m > 1 ? "s" : ""} abroad. Which assignment type fits that duration?`,
    a: [ans, ...["Corporate (long-term) expatriate", "Short-term assignee", "Flexpatriate", "International commuter"].filter(x => x !== ans).slice(0, 3)],
    e: "Flexpatriates: usually 1–3 months. Short-term: 3–12 months. Corporate expatriates: 12 months or more." };
});
IG(7, r => {
  const s = iRp(r, [[3, "weeks", 0], [1, "month", 0], [4, "months", 1], [9, "months", 1], [18, "months", 2], [3, "years", 2]]),
    A = [["Information-giving, less than 1 week", "Low"], ["Affective, 1–4 weeks", "Moderate"], ["Immersion, 1–2+ months", "High"]][s[2]];
  return { q: `Using the Mendenhall–Dunbar–Oddou CCT model, an expatriate will stay ${s[0]} ${s[1]}. Interaction with locals and culture novelty rise with the stay. Which approach and training length fit?`,
    a: [A[0], ...["Information-giving, less than 1 week", "Affective, 1–4 weeks", "Immersion, 1–2+ months"].filter(x => x !== A[0]), "Immersion, less than 1 week"],
    e: `Stay ≤ 1 month → information-giving (low rigor). 2–12 months → affective (moderate). 1–3 years → immersion (high). This stay calls for ${A[1].toLowerCase()} rigor.` };
});
IG(5, r => {
  const n = iRp(r, [20, 25, 40, 50]), p = iRp(r, [0.1, 0.2, 0.6, 0.7]), t = iRp(r, [0.1, 0.2]), P = Math.round(n * p), T = Math.round(n * t), H = n - P - T,
    pct = x => Math.round(x / n * 100) + "%", ans = P / n >= 0.5 ? "Ethnocentric" : "Polycentric";
  return { q: `A subsidiary's ${n} top managers include ${P} PCNs, ${T} TCNs, and the rest HCNs. What percentage are HCNs, and which staffing approach does the mix suggest (HQ jobs are all PCNs)?`,
    a: [`${pct(H)} HCNs — ${ans.toLowerCase()}`, `${pct(H)} HCNs — ${ans === "Ethnocentric" ? "polycentric" : "ethnocentric"}`, `${pct(P)} HCNs — ${ans.toLowerCase()}`, `${pct(T)} HCNs — geocentric`],
    e: `HCNs = ${n} − ${P} − ${T} = ${H} → ${H}/${n} = ${pct(H)}. Mostly PCNs in key posts = ethnocentric; mostly HCNs running the subsidiary = polycentric.` };
});
IG(6, r => {
  const g = iRp(r, [["15% market share growth", "Hard goal"], ["Return on investment of 12%", "Hard goal"], ["Building trust with the local union", "Soft goal"], ["Leadership style with HCN staff", "Soft goal"], ["Adjusting targets for a 20% currency devaluation", "Contextual goal"], ["Allowing for a new local labor law outside the manager's control", "Contextual goal"]]);
  return { q: `Classify this appraisal criterion for an expatriate: "${g[0]}".`, a: [g[1], ...["Hard goal", "Soft goal", "Contextual goal", "Functional goal"].filter(x => x !== g[1]).slice(0, 3)],
    e: "Hard = objective and quantifiable. Soft = relationship or trait based. Contextual = takes situational factors outside the person's control into account." };
});

  const R = S.result, acc = S.order.reduce((a, p) => a + S.players[p].ok, 0), tot = S.order.reduce((a, p) => a + S.players[p].tot, 0);
  const grid = S.grid.map(g => g === 2 ? "⬛" : g === 1 ? "🔳" : "⬜").join("").replace(/(.{10})/gu, "$1\n");
  return `Study Quest — ${PACK.meta.title}\n${R.win ? "✅ " + TH().winText : "📦 " + TH().loseText}\n👥 ${S.order.length} · ⏱ ${mmss(R.ms)} · 🎯 ${tot ? Math.round(acc / tot * 100) : 0}% · ${TH().chaosName} ${Math.floor(S.chaos)}/10\n${S.order.map(p => clsOf(S.players[p]).name).join(", ")}\n${grid}\n${SITE_URL}`;
}
function endView() {
  const R = S.result, txt = shareText();
  app.innerHTML = `<div class="box center"><h1>${R.win ? esc(TH().winText) : esc(TH().loseText)}</h1>
    <div class="row" style="justify-content:center">${S.order.map(p => personSVG(clsOf(S.players[p]).art, 64, !R.win)).join("")}</div>
    <p>${mmss(R.ms)} · ${R.rounds} combat rounds · cleared: ${S.map.dungeons.filter(id => S.map.tiles[id].done).map(id => esc(dname(S.map.tiles[id].d))).join(", ") || "nothing yet"}</p></div>
    <div class="spacer"></div>
    <div class="box"><h3 style="margin-top:0">Promotions</h3><ul>${S.order.map(p => { const pl = S.players[p]; return `<li><b>${esc(pl.name)}</b> (${esc(clsOf(pl).name)}): ${pl.ok}/${pl.tot} correct${pl.tot ? ` (${Math.round(pl.ok / pl.tot * 100)}%)` : ""}</li>`; }).join("")}</ul></div>
    <div class="spacer"></div>
    <div class="box"><div class="share">${esc(txt)}</div><div class="row" style="margin-top:8px"><button class="btn" id="copyres">Copy results</button>${navigator.share ? `<button class="btn" id="shareres">Share…</button>` : ""}</div></div>
    <div class="spacer"></div>
    <div class="row">${isHostish() ? `<button class="btn dark" id="again">Run it back (same team)</button>` : `<span class="muted">The host can start another run.</span>`}<button class="btn" id="quit">Main menu</button></div>`;
  bind("#copyres", () => copyText(txt, "Results copied."));
  bind("#shareres", () => navigator.share({ text: txt }).catch(() => {}));
  bind("#again", () => dispatch({ type: "RESET" }));
  bind("#quit", leaveGame);
}

/* ---------- timers ---------- */
function tick() {
  const now = Date.now();
  app.querySelectorAll("[data-dl]").forEach(el => { const dl = +el.dataset.dl; el.textContent = dl ? Math.max(0, Math.ceil((dl - now) / 1000)) + "s" : ""; });
}
setInterval(() => {
  tick();
  if (NET.mode === "host" && S && S.phase === "combat") {
    const C = S.combat, now = Date.now();
    if (C.step === "talk" && now >= C.talkUntil) dispatch({ type: "TALK_END" });
    else if (C.step === "answer" && C.deadline && S.order.some(p => S.players[p].conn && C.ans[p] === undefined && now >= C.deadline + (C.extra[p] || 0))) dispatch({ type: "TIMEOUT" });
    else if (C.step === "reveal" && now >= C.revealAt + REVEAL_AUTO_MS) dispatch({ type: "NEXT", round: C.round });
  }
  if (NET.mode === "client" && UI.lost && NET.peer && !NET.peer.destroyed && (!NET.conn || !NET.conn.open) && Date.now() > (UI.nextTry || 0)) { UI.nextTry = Date.now() + 4000; try { openConn(); } catch (e) {} }
}, 300);
document.addEventListener("keydown", e => {
  if (!S || /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  const k = +e.key; if (k >= 1 && k <= 6) { const b = app.querySelector(`[data-o="${k - 1}"]`); if (b) b.click(); }
  if (e.key === "Enter") { const b = app.querySelector("#next,#evdone,#roll,#show"); if (b && !e.repeat) b.click(); }
});

/* ============================================================
   TESTS & BOTS  (?test runs the checks; ?demo=N plays N bot steps on one device)
   ============================================================ */
function pathStep(S, targets) {
  const T = S.map.tiles, blocked = id => dungeonLocked(S, T[id]);
  const prev = { [S.pos]: null }, Q = [S.pos];
  while (Q.length) { const c = Q.shift(); if (c !== S.pos && targets.includes(c)) { let x = c; while (prev[x] !== S.pos) x = prev[x]; return x; }
    for (const n of nbrs(c, T)) if (!(n in prev) && !blocked(n)) { prev[n] = c; Q.push(n); } }
  return null;
}
function botAction(S, acc, r) {
  const T = S.map && S.map.tiles;
  switch (S.phase) {
    case "lobby": { const p = S.order.find(x => !S.players[x].cls); return p ? { type: "PICK", pid: p, cls: pick(r, PACK.classes).id } : { type: "START" }; }
    case "map": {
      const p = active(S); if (!S.roll) return { type: "ROLL", pid: p };
      if (S.moves > 0) {
        const hurtTeam = S.order.some(q => S.players[q].hp < S.players[q].max * 0.45), goal = S.map.dungeons[Math.min(2, S.dcleared)];
        const near = id => hexDist(id, S.pos) <= 3, ty = id => T[id].type;
        const visited = S.botVisited = S.botVisited || {}; visited[S.pos] = 1;
        const targets = [goal].concat(Object.keys(T).filter(id => !T[id].done && !visited[id] && near(id) && (ty(id) === "cache" || (hurtTeam && ty(id) === "rest") ||
          (ty(id) === "shop" && S.gold >= 60) || (ty(id) === "recruit" && S.gold >= 50 && S.hires.length < MAX_HIRES))));
        const to = pathStep(S, targets); if (to) return { type: "MOVE", pid: p, to };
      }
      return { type: "END_MOVE", pid: p };
    }
    case "shop": { const p = active(S), pl = S.players[p], hires = S.shop.kind === "hires";
      const it = S.shop.botDone ? null : S.shop.stock.map(id => hires ? hireById(id) : PACK.items.find(x => x.id === id)).find(it => it && it.cost <= S.gold && (hires ? S.hires.length < MAX_HIRES : pl.items.length < 4));
      if (it) { S.shop.botDone = true; return { type: "BUY", pid: p, item: it.id }; } return { type: "SHOP_DONE", pid: p }; }
    case "event": { const E = S.event; if ((E.kind === "review" || E.kind === "lock") && !E.done) return { type: "ANSWER", pid: E.pid, i: r() < acc ? E.q.ans : (E.q.ans + 1) % E.q.opts.length }; return { type: "EVENT_DONE", pid: E.pid }; }
    case "combat": { const C = S.combat;
      if (C.step === "talk") return { type: "TALK_END" };
      if (C.step === "answer") { const p = S.order.find(x => C.ans[x] === undefined); const pl = S.players[p];
        const hi = pl.items.findIndex(id => { const it = PACK.items.find(x => x.id === id); return it && it.fx.some(f => f.op === "heal") && pl.hp < pl.max * 0.4; });
        if (hi >= 0) return { type: "USE", pid: p, idx: hi };
        const q = C.qs[p]; return { type: "ANSWER", pid: p, i: r() < acc ? q.ans : (q.ans + 1) % q.opts.length }; }
      return { type: "NEXT", round: C.round }; }
  }
  return null;
}
/* Simulated clock (seconds) for run-length estimates: answer ~16 s plus a little per extra player, reveal ~6 s. */
function simTime(S, a, n) {
  switch (a.type) { case "ROLL": return 4; case "MOVE": return 2; case "END_MOVE": return 1; case "BUY": return 6; case "SHOP_DONE": return 6;
    case "TALK_END": return 8; case "ANSWER": return S.phase === "event" ? 18 : 0; case "NEXT": return 16 + 2 * n + 6; case "EVENT_DONE": return 5; }
  return 0;
}
function simulate(seed, n, acc) {
  const sim = newGame(seed, "SIM"); sim.local = n === 1; const r = rngFor(seed, "bot");
  for (let i = 1; i <= n; i++) reduce(sim, { type: "JOIN", pid: "p" + i, name: "Bot" + i, now: 0 });
  let t = 0, steps = 0, combats = 0;
  while (sim.phase !== "end" && steps < 8000) {
    const a = botAction(sim, acc, r); if (!a) break; a.now = t * 1000; if (!a.pid) a.pid = "p1";
    const ph = sim.phase; reduce(sim, a); if (ph !== "combat" && sim.phase === "combat") combats++;
    t += simTime(sim, a, n); steps++;
  }
  return { log: sim.log.slice(-10), lives0: 4, why: sim.result ? sim.result.why : "", win: !!(sim.result && sim.result.win), ended: sim.phase === "end", min: t / 60, steps, rounds: sim.grid.length, combats, dcleared: sim.dcleared, turns: sim.turns, hires: sim.hires.length };
}
/* Win rate for one fight at a fixed accuracy (no items, no hires). */
function fightOdds(bar, kind, n, acc, trials) {
  let wins = 0;
  for (let k = 0; k < trials; k++) {
    const sim = newGame("F" + bar + kind + n + acc + k, "SIM"); sim.local = true; const r = rngFor(sim.seed, "bot");
    for (let i = 1; i <= n; i++) { reduce(sim, { type: "JOIN", pid: "p" + i, name: "B" + i, now: 0 }); reduce(sim, { type: "PICK", pid: "p" + i, cls: pick(r, PACK.classes).id, now: 0 }); }
    reduce(sim, { type: "START", now: 0 }); sim.lives = 99;
    const t = sim.map.tiles[sim.map.dungeons[2]], e = PACK.enemies.find(x => kind === "boss" ? x.boss : kind === "elite" ? x.elite : !x.boss && !x.elite);
    t.rooms = [{ enemy: e.id, bar }]; t.progress = 0;
    startCombat(sim, t.id, rr(sim));
    let guard = 0;
    while (sim.phase === "combat" && !sim.combat.over && guard++ < 500) {
      const C = sim.combat;
      if (C.step === "reveal") { reduce(sim, { type: "NEXT", round: C.round, now: 0 }); continue; }
      for (const p of sim.order) if (C.ans[p] === undefined) reduce(sim, { type: "ANSWER", pid: p, i: r() < acc ? C.qs[p].ans : (C.qs[p].ans + 1) % C.qs[p].opts.length, now: 0 });
    }
    if (sim.combat && sim.combat.over === "win") wins++;
  }
  return Math.round(wins / trials * 100) + "%";
}
function runTests() {
  const out = { pass: [], fail: [] }, ok = (c, m) => (c ? out.pass : out.fail).push(m);
  const b = validatePack(BUILTIN_RAW); ok(b.ok, "built-in pack validates" + (b.ok ? "" : ": " + b.errors.join("; ")));
  ok(b.pack.questions.length >= 200, "built-in has " + b.pack.questions.length + " questions");
  const pv = validatePack(PRACTICE_RAW); ok(pv.ok && !pv.warnings.length && pv.pack.questions.length === 59, "practice exam pack validates (" + pv.pack.questions.length + " questions" + (pv.warnings.length ? "; " + pv.warnings.join(" ") : "") + ")");
  const iv = validatePack(IHRM_RAW); ok(iv.ok && !iv.warnings.length, "IHRM Ch 4–7 pack validates (" + iv.pack.questions.length + " questions" + (iv.ok ? "" : "; " + iv.errors.join(" ")) + (iv.warnings.length ? "; " + iv.warnings.join(" ") : "") + ")");
  let gbad = 0; for (const g of IHRM_GENS) for (let k = 0; k < 60; k++) { const o = g.make(rngFor("g", k)); if (!o.q || o.a.length < 3 || new Set(o.a).size !== o.a.length) gbad++; }
  ok(!gbad, "IHRM lockpick calculators make 2+ distinct options (" + gbad + " bad)");
  const base = JSON.parse(JSON.stringify(BUILTIN_RAW));
  const broken = [
    ["not an object", 42], ["wrong schema", { ...base, schema: "x" }], ["no boss", { ...base, enemies: base.enemies.filter(e => !e.boss) }],
    ["too few questions", { ...base, questions: base.questions.slice(0, 10) }], ["two classes", { ...base, classes: base.classes.slice(0, 2) }],
    ["bad item op", { ...base, items: [{ id: "x", name: "X", cost: 5, fx: [{ op: "explode", n: 9 }] }] }]
  ];
  for (const [label, p] of broken) { const v = validatePack(p); ok(!v.ok && v.errors.length > 0, `broken pack rejected (${label}): ${v.errors[0] || "NOT REJECTED"}`); }
  const sneaky = { ...base, questions: base.questions.slice(0, 40).concat([{ kind: "mc", c: "7", q: "<img src=x onerror=alert(1)>", a: ["a", "a"] }, { kind: "tf", c: "99", q: "x", tf: true }]) };
  const sv = validatePack(sneaky); ok(sv.ok && sv.warnings.length >= 2, "bad questions skipped with warnings (" + sv.warnings.length + ")");
  loadBuiltin();
  const part = QS.get("test") || "all", runs = [], errs = [];
  if (part === "all" || part === "sim") for (let n = 1; n <= 6; n++) for (let k = 0; k < 34; k++) { try { runs.push({ n, ...simulate("T" + n + "x" + k, n, +(QS.get("acc") || 0.72)) }); } catch (e) { errs.push(n + "/" + k + ": " + e.message + " " + (e.stack || "").split("\n")[1]); } }
  out.soloLoss = runs.filter(x => x.n === 1 && !x.win).slice(0, 2).map(x => ({ turns: x.turns, combats: x.combats, d: x.dcleared, log: x.log }));
  ok(!errs.length, "autoplay without exceptions (" + runs.length + " runs)" + (errs.length ? " — " + errs.slice(0, 3).join(" | ") : ""));
  ok(runs.every(x => x.ended), "every autoplay run ends (" + runs.filter(x => !x.ended).length + " stuck)");
  const byN = {}; for (const x of runs) (byN[x.n] = byN[x.n] || []).push(x);
  out.byPlayers = Object.fromEntries(Object.entries(byN).map(([n, xs]) => { const m = xs.map(x => x.min).sort((a, b) => a - b);
    return [n, { winRate: Math.round(xs.filter(x => x.win).length / xs.length * 100) + "%", medianMin: +m[m.length >> 1].toFixed(1), minMin: +m[0].toFixed(1), maxMin: +m[m.length - 1].toFixed(1), avgRounds: +(xs.reduce((a, x) => a + x.rounds, 0) / xs.length).toFixed(1), avgCombats: +(xs.reduce((a, x) => a + x.combats, 0) / xs.length).toFixed(1), avgTurns: +(xs.reduce((a, x) => a + x.turns, 0) / xs.length).toFixed(1), dungeons: [0, 1, 2, 3].map(d => xs.filter(x => x.dcleared === d).length).join("/"), why: ["hp", "deadline", "layoffs", "final"].map(w => w + ":" + xs.filter(x => !x.win && x.why === w).length).join(" ") }]; }));
  out.barOdds = {};
  if (part === "all" || part === "odds") for (const n of [1, 3, 6]) for (const [bar, kind] of [[0.6, "normal"], [0.8, "elite"], [0.9, "boss"]]) { const row = {}; for (const acc of [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]) row[Math.round(acc * 100) + "%"] = fightOdds(bar, kind, n, acc, 100); out.barOdds[`n${n} bar${bar * 100} ${kind}`] = row; }
  // map sanity
  let mapBad = 0; for (let k = 0; k < 200; k++) { const m = genMap("M" + k), T = m.tiles, d = bfs(m.start, T);
    const cnt = ty => Object.values(T).filter(t => t.type === ty).length;
    if (Object.keys(d).length !== Object.keys(T).length || cnt("dungeon") !== 3 || cnt("enemy") < 5 || cnt("recruit") < 2 || cnt("cache") < 3 || d[m.dungeons[2]] < 10) mapBad++; }
  ok(!mapBad, "200 maps connected, 3 dungeons, rivals, job fairs, caches; HQ far away (" + mapBad + " bad)");
  // determinism
  ok(JSON.stringify(simulate("DET", 3, 0.7)) === JSON.stringify(simulate("DET", 3, 0.7)), "same seed → same run");
  // redaction
  S = newGame("RED", "ABCD"); ["p1", "p2"].forEach(p => reduce(S, { type: "JOIN", pid: p, name: p, now: 1 })); S.order.forEach(p => reduce(S, { type: "PICK", pid: p, cls: PACK.classes[0].id, now: 1 }));
  reduce(S, { type: "START", now: 1 }); const ce = Object.values(S.map.tiles).find(t => t.type === "enemy"); startCombat(S, ce.id, rr(S)); beginRound(S, rr(S));
  const red = redact("p2"); ok(red.combat.qs.p1.hidden && red.combat.qs.p2.ans === undefined && !red.tokens, "clients cannot see others' questions or answers");
  S = null;
  return out;
}
function demo(steps) {
  NET.mode = "local"; S = newGame(QS.get("seed") || "DEMO", "LOCAL"); S.local = true; ME = "p1";
  const names = (QS.get("names") || "Dana,Ravi,Kim").split(",");
  names.forEach((x, i) => reduce(S, { type: "JOIN", pid: "p" + (i + 1), name: x, now: 0 }));
  const r = rngFor("demo", "bot"); let t = 0;
  const stop = QS.get("stop");
  for (let i = 0; i < steps && S.phase !== "end"; i++) {
    const a = botAction(S, 0.75, r); if (!a) break; a.now = t; if (!a.pid) a.pid = "p1"; reduce(S, a); t += 5000;
    if (stop && i > steps / 2 && (stop === S.phase || (S.combat && S.combat.step === stop))) break;
  }
  if (QS.get("show")) UI.shownFor = viewer();
  render();
}

/* Online bot (?bot=1): plays this device's seat, for two-device tests. */
function onlineBot() {
  if (!S || !ME || UI.lost) return;
  const me = S.players[ME]; if (!me) return; const host = NET.mode === "host";
  if (S.phase === "lobby") { if (!me.cls) return dispatch({ type: "PICK", cls: PACK.classes[S.order.indexOf(ME) % PACK.classes.length].id }); if (host && S.order.length >= +(QS.get("players") || 2) && S.order.every(p => S.players[p].cls)) dispatch({ type: "START" }); return; }
  if (S.phase === "map" && active(S) === ME) {
    if (!S.roll) return dispatch({ type: "ROLL" });
    const to = S.moves > 0 && pathStep(S, [S.map.dungeons[Math.min(2, S.dcleared)]]); return dispatch(to ? { type: "MOVE", to } : { type: "END_MOVE" });
  }
  if (S.phase === "shop" && active(S) === ME) return dispatch({ type: "SHOP_DONE" });
  if (S.phase === "event" && S.event.pid === ME) return S.event.done ? dispatch({ type: "EVENT_DONE" }) : dispatch({ type: "ANSWER", i: 0 });
  if (S.phase === "combat") { const C = S.combat;
    if (C.step === "answer" && C.ans[ME] === undefined && C.qs[ME] && !C.qs[ME].hidden) return dispatch({ type: "ANSWER", i: host && C.qs[ME].ans != null ? C.qs[ME].ans : 0 });
    if (C.step === "reveal" && host) return dispatch({ type: "NEXT", round: C.round }); }
}
if (QS.has("bot")) { window.__sq = () => ({ S, ME, mode: NET.mode, status: NET.status, err: UI.err, lost: UI.lost, code: NET.code }); setInterval(onlineBot, 700); }
if (QS.get("name")) UI.name = QS.get("name");

/* ---------- boot ---------- */
loadDefault();
if (QS.has("test")) { let res; try { res = runTests(); } catch (e) { res = { crash: e.message, stack: String(e.stack) }; } app.innerHTML = `<pre id="testout">${esc(JSON.stringify(res, null, 1))}</pre>`; }
else if (QS.has("demo")) demo(+QS.get("demo") || 0);
else {
  const h = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1]; if (h) UI.joinCode = h.toUpperCase();
  if (QS.get("auto") === "host" && UI.name) startHost(); else if (QS.get("join") && UI.name) startClient(QS.get("join")); else render();
}
