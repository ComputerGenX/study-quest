<style>

<script>
"use strict";

/* ============================================================
   DATA — Case 8: Local and International? (Andresen, 2023)
   Each decision has 4 options. d = [trust, family, fair, savings] changes.
   trust = Akiko's trust (procedural justice); family = family stability;
   fair = perceived fairness (equity); savings = company cost control.
   Higher is better for all four.
   ============================================================ */
const METERS = [["trust", "Akiko's trust (procedural justice)"], ["family", "Family stability"], ["fair", "Perceived fairness (equity)"], ["savings", "Company savings"]];
const START = { trust: 3, family: 3, fair: 3, savings: 3 };
const METER_MAX = 6;
const VOTE_SECONDS = 30;
const COLORS = ["#e2574c", "#3d7fd6", "#d9a521", "#3f9a5c"];
const SHAPES = ["triangle", "diamond", "circle", "square"];

const DECISIONS = [
  {
    title: "Decision 1: The explanation meeting",
    scene: "office",
    prompt: "Akiko is upset about the new policy. How does Puja handle the meeting?",
    options: [
      { label: "Explain the reasons, listen, and invite questions", d: [2, 0, 1, 0],
        reaction: "Akiko says what worries her. Puja takes notes and promises a written answer.",
        why: "Voice and explanation are procedural justice. People accept a hard outcome when the process feels fair." },
      { label: "State the policy. Sign by Friday or leave the program.", d: [-2, -1, -1, 1],
        reaction: "Akiko feels pressured. She leaves the room without asking more questions.",
        why: "A closed process lowers trust. Staff read the outcome as unfair, even when pay is the same." },
      { label: "Book a second meeting with the policy team to explain the cost basis", d: [1, 0, 1, -1],
        reaction: "Akiko gets the cost facts. The budget team is not happy about the extra time.",
        why: "Accurate information is a procedural justice rule. It makes the outcome easier to accept." },
      { label: "Offer Akiko a private side deal and do not explain the policy", d: [0, 1, -2, -1],
        reaction: "Akiko gets a better deal. Other staff hear about it and ask why they were not offered the same.",
        why: "Inconsistent treatment breaks the consistency rule. Others see the outcome as unfair." }
    ]
  },
  {
    title: "Decision 2: Who is Akiko's referent?",
    scene: "policy",
    prompt: "Akiko compares her package with others. Which referent person does she choose?",
    options: [
      { label: "Expatriates in New Delhi with full packages", d: [-1, 0, -2, 0],
        reaction: "Akiko sees a large gap. Her inputs are the same, but her outcomes are much smaller.",
        why: "Equity theory: people compare their outcome-to-input ratio with a referent. Expatriates are a strong referent for local international hires." },
      { label: "Local colleagues in Singapore with the same job", d: [0, 0, 1, 1],
        reaction: "The gap is small. Akiko feels the package is fair for the local market.",
        why: "A local referent gives a fair comparison. This matches the host-country pay basis." },
      { label: "Her own past expatriate package", d: [-1, 0, -1, 0],
        reaction: "Akiko remembers the old package. She feels she is losing something.",
        why: "A self-referent comparison (past self) can make a new package look poor, even if it is fair in the market." },
      { label: "External new recruits hired locally", d: [0, 0, 1, 0],
        reaction: "Akiko feels better about her package. She knows the recruits get less.",
        why: "Comparing down raises perceived fairness for Akiko. The new recruits may compare up and feel unfair." }
    ]
  },
  {
    title: "Decision 3: Design the local international package",
    scene: "pay",
    prompt: "The company designs the package for local international hires. What does it include?",
    options: [
      { label: "Host salary, settling-in, visa, medical, travel, and a two-year housing and school allowance", d: [1, 1, 1, 0],
        reaction: "The package covers the costs of moving. Staff see the benefits as fair for the move.",
        why: "This matches the local international policy table. It balances equity and cost." },
      { label: "Host salary, settling-in, and travel only", d: [0, -1, 0, 1],
        reaction: "Costs are low. Families struggle with school and housing.",
        why: "Low cost, but the employee's inputs (family disruption, career risk) are high and the outcome is small." },
      { label: "Home-country salary for local international hires", d: [1, 1, 1, -2],
        reaction: "Staff feel equal to expatriates. The budget team asks how the policy now saves money.",
        why: "Balance-sheet pay is very fair to the employee, but it removes the cost goal of the policy." },
      { label: "The same package for external new recruits too", d: [0, 1, 1, -2],
        reaction: "All new hires get support. Costs rise sharply across all hires.",
        why: "This removes the gap between internal and external hires, but the cost is high." }
    ]
  },
  {
    title: "Decision 4: Rules for the future",
    scene: "office",
    prompt: "Akiko asks what happens if she wants to move again in three to five years. What does Puja promise?",
    options: [
      { label: "Written rules: review dates, an appeal path, and the same rules for all staff", d: [2, 1, 1, 0],
        reaction: "Akiko can plan. She trusts that the rules apply to others too.",
        why: "Consistency and correctability are procedural justice rules. They support positive behavioral intentions: commitment and willingness to move again." },
      { label: "The rules are final. No exceptions.", d: [-2, -1, -1, 1],
        reaction: "Akiko feels trapped. She starts to plan an exit.",
        why: "Low correctability lowers commitment." },
      { label: "Each manager decides case by case", d: [-1, 0, -1, 0],
        reaction: "The outcome depends on who the manager is. Akiko doubts the process.",
        why: "Bias suppression is missing. Managers may treat people differently, and staff notice." },
      { label: "A one-time exception for Akiko only", d: [1, 1, -2, -1],
        reaction: "Akiko is pleased. Colleagues hear about it and feel treated unfairly.",
        why: "This breaks consistency. Other employees compare themselves with Akiko and feel inequity." }
    ]
  },
  {
    title: "Decision 5: External recruits ask why",
    scene: "pay",
    prompt: "New local hires ask why local international hires get more support than they do. What does the company say?",
    options: [
      { label: "Explain the criteria openly, and open a review path for external hires", d: [1, 0, 1, 0],
        reaction: "The recruits understand the criteria. Some still want the same support.",
        why: "Explanation and voice help the recruits accept a policy that gives them less." },
      { label: "They are external. Different rules apply. That is the end of it.", d: [-1, 0, -1, 1],
        reaction: "The recruits feel unfairly treated. Some start looking for other jobs.",
        why: "An equity gap with no explanation raises turnover risk." },
      { label: "Give all local hires a retention bonus after two years", d: [1, 1, 1, -1],
        reaction: "Everyone sees a path to reward. Costs rise a little.",
        why: "Shared outcomes reduce the gap. The case lists a retention bonus as an optional item." },
      { label: "Remove the extra support from internal hires so all staff are equal", d: [-1, -1, 1, 2],
        reaction: "Costs fall. Internal hires feel their move is no longer worth it.",
        why: "Leveling down makes outcomes equal, but it stops rewarding the input of moving abroad." }
    ]
  }
];

const SUMMARY_HTML = `
<div class="box">
  <h2>Comparing the three package groups</h2>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:14px">
    <tr style="text-align:left"><th style="border:1px solid #222;padding:4px">Group</th><th style="border:1px solid #222;padding:4px">Pay basis</th><th style="border:1px solid #222;padding:4px">Benefits</th><th style="border:1px solid #222;padding:4px">Pension and social security</th><th style="border:1px solid #222;padding:4px">Main referent and risk</th></tr>
    <tr><td style="border:1px solid #222;padding:4px"><b>1. Expatriate contract</b><br>for career or job assignments (about 750 people)</td><td style="border:1px solid #222;padding:4px">Home-country salary (balance sheet)</td><td style="border:1px solid #222;padding:4px">Full package: housing, school, flights, relocation. Costs about three times base salary. Max 3 years.</td><td style="border:1px solid #222;padding:4px">Stays in home-country plans</td><td style="border:1px solid #222;padding:4px">Other expatriates and home colleagues. Costly; limited to critical positions.</td></tr>
    <tr><td style="border:1px solid #222;padding:4px"><b>2. Local international contract</b><br>for internal staff who move, like Akiko</td><td style="border:1px solid #222;padding:4px">Host-country salary and incentives</td><td style="border:1px solid #222;padding:4px">Settling-in, medical check, visa, outward travel, one home trip in year one. Optional housing and school allowance (50% in year two), retention bonus.</td><td style="border:1px solid #222;padding:4px">Host-country plan; cash equivalent where no state pension is allowed</td><td style="border:1px solid #222;padding:4px">Expatriates in the same city (large gap) or local colleagues (small gap). Risk: staff feel the package is poorer.</td></tr>
    <tr><td style="border:1px solid #222;padding:4px"><b>3. Local contract</b><br>for external international new recruits</td><td style="border:1px solid #222;padding:4px">Host-country salary</td><td style="border:1px solid #222;padding:4px">Local terms only. No mobility support.</td><td style="border:1px solid #222;padding:4px">Host-country plan</td><td style="border:1px solid #222;padding:4px">Local colleagues doing the same job. Risk: internal hires get more support for the same job.</td></tr>
  </table></div>

  <h3>Equity theory and the referent person</h3>
  <p>Equity theory says people compare their outcome-to-input ratio with a referent. A referent can be a colleague, an expatriate, a past self, or a group. The gap between groups 1 and 2 is the largest source of unfairness. Group 2 staff carry high inputs (moving the family, a career change, a new language) and receive smaller outcomes than expatriates. Group 3 staff compare with group 2 colleagues in the same office and may feel the same gap.</p>

  <h3>The role of procedural justice</h3>
  <p>Procedural justice concerns how the decision is made. Key rules include consistency, bias suppression, accuracy, correctability, voice, and ethics. When the procedure is fair, people accept an outcome that is less favorable. Fair procedures also build positive behavioral intentions: commitment, willingness to move, and recommending the company. In the case, Akiko received little information before the decision. She felt the company did not manage expectations. The company can use the procedure itself to reduce the equity gap.</p>

  <h3>Written answer support: SWOT and needs</h3>
  <div class="swot">
    <div class="box"><b>Strengths</b><ul><li>Lower cost than expatriate packages</li><li>Lets more staff move across borders</li><li>Supports the "one company" idea</li></ul></div>
    <div class="box"><b>Weaknesses</b><ul><li>Unclear rules for employees</li><li>Pension and social security gaps</li><li>Lower pay in some home countries</li></ul></div>
    <div class="box"><b>Opportunities</b><ul><li>Large talent pool in Asia</li><li>Local hires who stay for years</li><li>A clear policy can attract staff</li></ul></div>
    <div class="box"><b>Threats</b><ul><li>Talent loss to other employers</li><li>Families who refuse to move</li><li>Unfair-treatment claims</li></ul></div>
  </div>
  <div class="swot">
    <div class="box"><b>Employer needs</b><ul><li>Control cost</li><li>Move talent flexibly</li><li>Fewer expatriate contracts</li></ul></div>
    <div class="box"><b>Employee needs</b><ul><li>Fair pay for the cost of living</li><li>Family support: school, housing, visa</li><li>Pension clarity</li><li>Clear facts before a decision</li><li>A path back home or to a new role</li></ul></div>
  </div>
  <p><b>Elements to add to the package:</b> a written comparison of packages, family support rules, pension options by country, a return path, review dates, consistent rules, and an HR communication plan.</p>
</div>`;

/* ============================================================
   DOODLE STAGE — rough SVG figures (ink on paper)
   ============================================================ */
const INK = "#222";
function figure(x, ground, s, o = {}) {
  const hairs = {
    bun: `<circle cx="0" cy="-94" r="9" fill="#444"/><path d="M-17,-72 Q-19,-100 0,-100 Q19,-100 17,-72 Q0,-84 -17,-72Z" fill="#444"/>`,
    bob: `<path d="M-20,-70 Q-22,-104 0,-104 Q22,-104 20,-70 L22,-46 L15,-48 L14,-66 Q0,-80 -14,-66 L-15,-48 L-22,-46Z" fill="#444"/>`,
    short: `<path d="M-16,-74 Q-14,-98 2,-98 Q16,-96 16,-72 Q4,-84 -16,-74Z" fill="#444"/>`
  };
  const mouths = {
    smile: "M-6,-62 Q0,-56 6,-62",
    flat: "M-5,-60 L5,-60",
    worry: "M-6,-58 Q0,-64 6,-58"
  };
  const glasses = o.glasses
    ? `<circle cx="-6" cy="-70" r="6" fill="none"/><circle cx="6" cy="-70" r="6" fill="none"/>`
    : "";
  const blazer = o.blazer ? `<path d="M-6,-52 L0,-30 L6,-52" fill="none"/>` : "";
  return `<g transform="translate(${x} ${ground - 44 * s}) scale(${s})">
    <path d="M-10,12 L-12,44 M10,12 L12,44" fill="none"/>
    <path d="M-14,44 L-8,44 M8,44 L14,44" fill="none"/>
    <path d="M-22,-52 Q0,-58 22,-52 L26,12 L-26,12Z" fill="${o.shirt || "#fff"}"/>
    ${blazer}
    <path d="M-22,-48 Q-34,-20 -28,6 M22,-48 Q34,-20 28,6" fill="none"/>
    ${(o.hair === "short") ? "" : hairs[o.hair || "short"]}
    <circle cx="0" cy="-70" r="15" fill="#fff"/>
    ${(o.hair === "short") ? hairs.short : ""}
    <circle cx="-5" cy="-70" r="1.8" fill="${INK}" stroke="none"/>
    <circle cx="5" cy="-70" r="1.8" fill="${INK}" stroke="none"/>
    ${glasses}
    <path d="${mouths[o.mood || "smile"]}" fill="none"/>

}
function building(x, y, w, h, label) {
  let win = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) win += `<rect x="${x + 14 + c * ((w - 28) / 4)}" y="${y + 14 + r * 38}" width="18" height="18" fill="#fff"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>${win}<text x="${x + w / 2}" y="${y + h + 22}" text-anchor="middle" font-size="16" fill="${INK}" stroke="none" font-weight="bold">${label}</text>`;
}
const SCENES = {
  office: () => `
    <rect x="30" y="30" width="200" height="120" fill="#fff"/><path d="M30,190 L230,190" fill="none"/>

function stageSVG(scene) {

/* ============================================================
   WORD BUBBLES
   ============================================================ */
const STOP = new Set(["the", "a", "an", "and", "or", "of", "to", "in", "on", "for", "is", "it", "was", "be", "with", "that", "this", "at", "by", "from", "as", "i", "we", "they", "my", "our", "not", "no"]);
function cleanWord(s) {
  const first = String(s || "").trim().toLowerCase().split(/\s+/)[0] || "";
  const t = first.replace(/[^a-z'-]/g, "");
  if (t.length < 2 || t.length > 20 || STOP.has(t)) return "";
  return t;
}
function tally(words) {
  const m = new Map();
  for (const w of words) m.set(w, (m.get(w) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30);
}
function bubbleCloud(words, cls) {
  const entries = tally(words);
  if (!entries.length) return `<p class="muted">No words yet.</p>`;
  const max = entries[0][1];
  const W = 420, Hh = 300, placed = [];
  let html = "";
  for (const [w, c] of entries) {
    const fs = 14 + Math.round((c / max) * 34);
    const d = Math.round(Math.max(fs * w.length * 0.6, fs * 1.8) + 14);
    let x = 0, y = 0, ok = false;
    for (let k = 0; k < 1200 && !ok; k++) {
      const a = k * 0.55, r = k * 1.9;
      x = W / 2 + r * Math.cos(a) - d / 2;
      y = Hh / 2 + r * Math.sin(a) - d / 2;
      ok = x >= 0 && y >= 0 && x + d <= W && y + d <= Hh &&
        placed.every(p => Math.hypot((p.x + p.d / 2) - (x + d / 2), (p.y + p.d / 2) - (y + d / 2)) >= (p.d + d) / 2 - 4);
    }
    if (!ok) continue;
    placed.push({ x, y, d });

function hostStart(code) {
  H.code = code;

  peer.on("open", () => { H.ready = true; renderHost(); });
  peer.on("connection", conn => {
    H.conns.set(conn.peer, conn);
    conn.on("data", m => hostMsg(conn, m));
    conn.on("close", () => { H.conns.delete(conn.peer); renderHost(); });
  });
  peer.on("error", e => {

function hostMsg(conn, m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "join") {
    const name = String(m.name || "Student").replace(/[<>]/g, "").slice(0, 20) || "Student";
    H.players.set(conn.peer, { name });
    broadcast(); renderHost();
  } else if (m.t === "vote") {
    if (H.phase !== "vote" || m.round !== H.round || !H.players.has(conn.peer)) return;
    if (!Number.isInteger(m.opt) || m.opt < 0 || m.opt > 3) return;
    H.votes.set(conn.peer, m.opt);

    if (H.phase !== "why" || !H.players.has(conn.peer) || H.whySubmitted.has(conn.peer)) return;
    H.whySubmitted.add(conn.peer);
    const w = cleanWord(m.word);

    broadcast(); renderHost();
  } else if (m.t === "words") {
    if (H.phase !== "reflect" || !H.players.has(conn.peer) || H.submitted.has(conn.peer)) return;
    H.submitted.add(conn.peer);
    const r = cleanWord(m.right), w = cleanWord(m.wrong);
    if (r) H.words.right.push(r);
    if (w) H.words.wrong.push(w);
    broadcast(); renderHost();
  }
}
function viewFor(id) {
  const v = { phase: H.phase, round: H.round, total: DECISIONS.length, players: H.players.size };
  if (H.phase === "lobby" || H.phase === "brief") { v.names = [...H.players.values()].map(p => p.name); }
  if (H.phase === "vote") {
    const d = DECISIONS[H.round];

function applyResult(idx) {

function closeVote() {
  if (H.phase !== "vote") return;
  const d = DECISIONS[H.round];
  const counts = d.options.map(() => 0);
  for (const v of H.votes.values()) counts[v]++;
  const max = Math.max(...counts);
  const tops = counts.map((c, i) => (c === max ? i : -1)).filter(i => i >= 0);
  let winner = tops[0], tieNote = "";
  if (max === 0) { winner = 0; tieNote = "No votes. The class uses option A."; }
  else if (tops.length > 1) { winner = tops[Math.floor(Math.random() * tops.length)]; tieNote = "Tie. The game picked one of the tied options by chance."; }
  const before = meterObj();
  applyResult(winner);
  const opt = d.options[winner];
  H.result = { counts, winner, tieNote, reaction: opt.reaction, why: opt.why, label: opt.label, before, after: meterObj() };

function clientJoin(code, name) {

  if (!/^[A-Z]{4}$/.test(CL.code)) { CL.err = "Enter the 4-letter room code."; renderClient(); return; }

  CL.role = "student"; CL.view = null;
  renderClient();
  const peer = new Peer(PEER_OPTS);
  CL.peer = peer;
  const timeout = setTimeout(() => { if (!CL.joined) { CL.err = "Could not reach the room. Check the code and try again."; try { peer.destroy(); } catch (e) {} CL.peer = null; renderClient(); } }, 20000);
  peer.on("error", () => { CL.err = "Could not connect. Check the code and try again."; CL.peer = null; renderClient(); });
  peer.on("open", () => {
    const conn = peer.connect(PREFIX + CL.code.toLowerCase(), { reliable: true });
    CL.conn = conn;
    conn.on("open", () => { CL.joined = true; clearTimeout(timeout); conn.send({ t: "join", name: CL.name }); renderClient(); });
    conn.on("data", m => {
      if (m && m.t === "view") {
        const prevRound = CL.view ? CL.view.round + ":" + CL.view.phase : "";
        CL.view = m.v;
        if (m.v.remaining !== undefined) CL.deadline = Date.now() + m.v.remaining;

  });

    if (Date.now() >= H.deadline) closeVote();
  }
  if (CL.role === "student" && CL.view && CL.view.phase === "vote" && el) {
    el.textContent = Math.ceil(Math.max(0, CL.deadline - Date.now()) / 1000);
  }
}, 250);

function startScreen() {
  const app = document.getElementById("app");
  app.innerHTML = `<h1>Case 8: Local and International?</h1>
    <div class="box"><p>A classroom vote game. The host runs the projector. Students join on phones.</p>
    <p><button id="s-host">Host on the projector</button></p>
    <p><button id="s-join">Join on a phone</button></p></div>`;
  document.getElementById("s-host").onclick = () => { H.role = "host"; H.code = newCode(); hostStart(H.code); renderHost(); };
  document.getElementById("s-join").onclick = () => { CL.role = "student"; CL.joined = false; renderClient(); };
}
startScreen();
</script>
</body>
