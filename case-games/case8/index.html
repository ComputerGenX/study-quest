const INK = "#222";

    : "";

    ${blazer}
    <path d="M-22,-48 Q-34,-20 -28,6 M22,-48 Q34,-20 28,6" fill="none"/>
    ${(o.hair === "short") ? "" : hairs[o.hair || "short"]}
    <circle cx="0" cy="-70" r="15" fill="#fff"/>
    ${(o.hair === "short") ? hairs.short : ""}
    <circle cx="-5" cy="-70" r="1.8" fill="${INK}" stroke="none"/>

function building(x, y, w, h, label) {
  let win = "";

}
const SCENES = {

/* ============================================================
   WORD BUBBLES
   ============================================================ */
const STOP = new Set(["the", "a", "an", "and", "or", "of", "to", "in", "on", "for", "is", "it", "was", "be", "with", "that", "this", "at", "by", "from", "as", "i", "we", "they", "my", "our", "not", "no"]);
function cleanWord(s) {
  const first = String(s || "").trim().toLowerCase().split(/\s+/)[0] || "";
  const t = first.replace(/[^a-z'-]/g, "");
  if (t.length < 2 || t.length > 20 || STOP.has(t)) return "";
  return t;
}
function tally(words) {
  const m = new Map();
  for (const w of words) m.set(w, (m.get(w) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30);
}
function bubbleCloud(words, cls) {
  const entries = tally(words);
  if (!entries.length) return `<p class="muted">No words yet.</p>`;
  const max = entries[0][1];
  const W = 420, Hh = 300, placed = [];
  let html = "";
  for (const [w, c] of entries) {
    const fs = 14 + Math.round((c / max) * 34);
    const d = Math.round(Math.max(fs * w.length * 0.6, fs * 1.8) + 14);
    let x = 0, y = 0, ok = false;
    for (let k = 0; k < 1200 && !ok; k++) {
      const a = k * 0.55, r = k * 1.9;
      x = W / 2 + r * Math.cos(a) - d / 2;
      y = Hh / 2 + r * Math.sin(a) - d / 2;
      ok = x >= 0 && y >= 0 && x + d <= W && y + d <= Hh &&
        placed.every(p => Math.hypot((p.x + p.d / 2) - (x + d / 2), (p.y + p.d / 2) - (y + d / 2)) >= (p.d + d) / 2 - 4);
    }
    if (!ok) continue;
    placed.push({ x, y, d });
    html += `<div class="bub ${cls}" title="${esc(w)}: ${c}" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;font-size:${fs}px">${esc(w)}<small>${c}</small></div>`;
  }
  return `<div class="cloud" style="width:${W}px;max-width:100%;height:${Hh}px">${html}</div>`;
}

function hostStart(code) {
  H.code = code;
  const peer = new Peer(PREFIX + code.toLowerCase(), PEER_OPTS);
  H.peer = peer;
  peer.on("open", () => { H.ready = true; renderHost(); });
  peer.on("connection", conn => {
    H.conns.set(conn.peer, conn);
    conn.on("data", m => hostMsg(conn, m));
    conn.on("close", () => { H.conns.delete(conn.peer); renderHost(); });
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id") { H.peer = null; hostStart(newCode()); }
    else { H.error = "Network error: " + e.type; renderHost(); }
  });
}
function hostMsg(conn, m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "join") {
    const name = String(m.name || "Student").replace(/[<>]/g, "").slice(0, 20) || "Student";
    H.players.set(conn.peer, { name });
    broadcast(); renderHost();
  } else if (m.t === "vote") {
    if (H.phase !== "vote" || m.round !== H.round || !H.players.has(conn.peer)) return;
    if (!Number.isInteger(m.opt) || m.opt < 0 || m.opt > 3) return;
    H.votes.set(conn.peer, m.opt);
    if (H.players.size > 0 && [...H.players.keys()].every(id => H.votes.has(id))) closeVote();
    else renderHost();
  } else if (m.t === "words") {
    if (H.phase !== "reflect" || !H.players.has(conn.peer) || H.submitted.has(conn.peer)) return;
    H.submitted.add(conn.peer);
    const r = cleanWord(m.right), w = cleanWord(m.wrong);
    if (r) H.words.right.push(r);
    if (w) H.words.wrong.push(w);
    broadcast(); renderHost();
  }
}
function viewFor(id) {
  const v = { phase: H.phase, round: H.round, total: DECISIONS.length, players: H.players.size };
  if (H.phase === "lobby" || H.phase === "brief") { v.names = [...H.players.values()].map(p => p.name); }
  if (H.phase === "vote") {
    const d = DECISIONS[H.round];
    v.title = d.title; v.prompt = d.prompt; v.scene = d.scene;
    v.options = d.options.map(o => o.label);
    v.remaining = Math.max(0, H.deadline - Date.now());
    v.myVote = H.votes.has(id) ? H.votes.get(id) : null;
  }
  if (H.phase === "result") {
    const d = DECISIONS[H.round];
    v.title = d.title; v.options = d.options.map(o => o.label);
    v.result = H.result; v.myVote = H.votes.has(id) ? H.votes.get(id) : null;
    v.meters = meterObj();
  }
  if (H.phase === "reflect") { v.mySubmitted = H.submitted.has(id); }
  if (H.phase === "end") { v.ending = H.ending; v.meters = meterObj(); }
  return v;
}
function broadcast() {
  for (const [id, conn] of H.conns) {
    if (conn.open) { try { conn.send({ t: "view", v: viewFor(id) }); } catch (e) { /* ignore */ } }
  }
}
function applyResult(idx) {
  const d = DECISIONS[H.round].options[idx].d;
  H.meters.trust = clamp(H.meters.trust + d[0]);
  H.meters.family = clamp(H.meters.family + d[1]);
  H.meters.savings = clamp(H.meters.savings + d[2]);
}
const clamp = n => Math.max(0, Math.min(METER_MAX, n));
function closeVote() {
  if (H.phase !== "vote") return;
  const d = DECISIONS[H.round];
  const counts = d.options.map(() => 0);
  for (const v of H.votes.values()) counts[v]++;
  const max = Math.max(...counts);
  const tops = counts.map((c, i) => (c === max ? i : -1)).filter(i => i >= 0);
  let winner = tops[0], tieNote = "";
  if (max === 0) { winner = 0; tieNote = "No votes. The class uses option A."; }
  else if (tops.length > 1) { winner = tops[Math.floor(Math.random() * tops.length)]; tieNote = "Tie. The game picked one of the tied options by chance."; }
  const before = meterObj();
  applyResult(winner);
  const opt = d.options[winner];
  H.result = { counts, winner, tieNote, reaction: opt.reaction, why: opt.why, label: opt.label, before, after: meterObj() };
  H.history.push(d.title.replace(/^Decision \d+: /, "") + ": " + opt.label);
  H.phase = "result";
  broadcast(); renderHost();
}
function startRound(r) {
  H.round = r; H.phase = "vote"; H.votes = new Map();
  H.deadline = Date.now() + VOTE_SECONDS * 1000;
  if (DEMO) for (const id of H.players.keys()) if (id.startsWith("bot")) H.votes.set(id, Math.floor(Math.random() * 4));
  broadcast(); renderHost();
  // Demo bots answer at once, so pause before the vote closes for the host to see it.
  if (H.players.size > 0 && [...H.players.keys()].every(id => H.votes.has(id))) setTimeout(closeVote, 3000);
}
function nextAfterResult() {
  if (H.round + 1 < DECISIONS.length) startRound(H.round + 1);
  else { H.phase = "reflect"; if (DEMO) botWords(); broadcast(); renderHost(); }
}
function botWords() {
  const R = ["clear", "fair", "family", "honest", "careful", "fast", "planning", "support"];
  const W = ["confusing", "rushed", "unfair", "silent", "cost", "trust", "pension", "stress"];
  for (const id of H.players.keys()) if (id.startsWith("bot") && !H.submitted.has(id)) {
    H.submitted.add(id);
    H.words.right.push(R[Math.floor(Math.random() * R.length)]);
    H.words.wrong.push(W[Math.floor(Math.random() * W.length)]);
  }
}
function endGame() { H.ending = endingText(meterObj()); H.phase = "end"; broadcast(); renderHost(); }
function addBots() {
  for (let i = 1; i <= 5; i++) H.players.set("bot" + i, { name: "Test " + i });
  renderHost();
}
function hostReset() {
  for (const conn of H.conns.values()) { try { conn.close(); } catch (e) {} }
  H.conns = new Map(); H.players = new Map(); H.phase = "lobby"; H.round = -1; H.votes = new Map();
  H.result = null; H.meters = { trust: START_METERS[0], family: START_METERS[1], savings: START_METERS[2] };
  H.words = { right: [], wrong: [] }; H.submitted = new Set(); H.ending = ""; H.history = [];
  renderHost();
}

function renderHost() {
  const app = document.getElementById("app");
  if (!H.code) { app.innerHTML = `<p><button id="h-make">Create room</button></p>`;
    $("#h-make").onclick = () => { H.code = newCode(); hostStart(H.code); }; return; }
  let html = `<div class="row"><h1>Case 8: Local and International?</h1>
    <span class="tag">Room ${esc(H.code)} · ${H.players.size} student${H.players.size === 1 ? "" : "s"}</span></div>`;
  if (H.error) html += `<p class="err">${esc(H.error)}</p>`;
  if (!H.ready) html += `<p class="muted">Opening the room…</p>`;

  if (H.phase === "lobby") {
    html += `<div class="box"><p>Students open this page on a phone and tap <b>Join</b>. Enter room code:</p>
      <p class="code">${esc(H.code)}</p>
      <ul class="name-list">${[...H.players.values()].map(p => `<li>${esc(p.name)}</li>`).join("") || "<li class='muted'>No students yet.</li>"}</ul></div>
      <p><button id="h-start" ${H.ready ? "" : "disabled"}>Start the case</button>
      ${DEMO ? ` <button id="h-bots">Add 5 test students</button>` : ""}
      <button id="h-reset">Close room</button></p>`;
  } else if (H.phase === "brief") {
    html += `${stageSVG("office")}<div class="box"><p>Akiko is an expatriate in New Delhi. Her three-year contract will not renew. HR offers a local international contract instead.</p>
      <p>The class votes on five decisions. Each vote takes about 30 seconds. The most popular choice moves the story forward.</p></div>
      <p><button id="h-begin">Begin decision 1</button></p>`;
  } else if (H.phase === "vote") {
    const d = DECISIONS[H.round];
    const voted = H.votes.size;
    html += `<div class="row"><span class="tag">Decision ${H.round + 1} of ${DECISIONS.length}</span><span class="timer" id="timer">${Math.ceil(Math.max(0, H.deadline - Date.now()) / 1000)}</span></div>
      ${stageSVG(d.scene)}<h2>${esc(d.title)}</h2><p class="big">${esc(d.prompt)}</p>
      <div class="opts">${d.options.map((o, i) => `<div class="hostcard" style="background:${COLORS[i]}">${shapeSVG(i, 40)}<span>${esc(o.label)}</span></div>`).join("")}</div>
      <p><b id="votedCount">${voted} of ${H.players.size} voted</b></p>
      <p><button id="h-close">Close vote now</button></p>`;
  } else if (H.phase === "result") {
    const d = DECISIONS[H.round], r = H.result;
    const total = Math.max(1, r.counts.reduce((a, b) => a + b, 0));
    html += `<div class="row"><span class="tag">Decision ${H.round + 1} of ${DECISIONS.length}</span></div>
      <h2>${esc(d.title)}</h2>
      <div class="opts">${d.options.map((o, i) => `
        <div class="hostcard ${i === r.winner ? "winner" : ""}" style="background:${COLORS[i]};opacity:${i === r.winner ? 1 : 0.72}">
          ${shapeSVG(i, 40)}<span>${esc(o.label)}<br><small>${r.counts[i]} vote${r.counts[i] === 1 ? "" : "s"}${i === r.winner ? " · CHOSEN" : ""}</small></span>
          <span class="fill" style="width:${Math.round((r.counts[i] / total) * 100)}%"></span></div>`).join("")}</div>
      ${r.tieNote ? `<p class="muted">${esc(r.tieNote)}</p>` : ""}
      <div class="box"><p class="big">${esc(r.reaction)}</p><p><b>Teaching point:</b> ${esc(r.why)}</p></div>
      <div class="box">${meterBars(r.after)}</div>
      <p><button id="h-next">${H.round + 1 < DECISIONS.length ? "Next decision" : "Reflection"}</button></p>`;
  } else if (H.phase === "reflect") {
    html += `<h2>Reflection</h2><p>Students send one word for what went RIGHT and one for what went WRONG. Words appear live. Bigger bubble means said more often.</p>
      <p class="muted">${H.submitted.size} of ${H.players.size} sent words.</p>
      <div class="cols"><div><h3>What went RIGHT</h3>${bubbleCloud(H.words.right, "right")}</div>
      <div><h3>What went WRONG</h3>${bubbleCloud(H.words.wrong, "wrong")}</div></div>
      <p><button id="h-end">Show the ending</button></p>`;
  } else if (H.phase === "end") {
    html += `<div class="box"><p class="big">${esc(H.ending)}</p>${meterBars(meterObj())}</div>
      <h3>Choices made</h3><ul>${H.history.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
      ${SUMMARY_HTML}
      <div class="cols"><div><h3>What went RIGHT</h3>${bubbleCloud(H.words.right, "right")}</div>
      <div><h3>What went WRONG</h3>${bubbleCloud(H.words.wrong, "wrong")}</div></div>
      <p><button id="h-new">Close room and start over</button></p>`;
  }
  app.innerHTML = html;
  bindHost();
}
function bindHost() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("h-start", () => { H.phase = "brief"; broadcast(); renderHost(); });
  on("h-bots", addBots);
  on("h-reset", hostReset);
  on("h-begin", () => startRound(0));
  on("h-close", closeVote);
  on("h-next", nextAfterResult);
  on("h-end", endGame);
  on("h-new", hostReset);
}

/* ============================================================
   CLIENT (student phone)
   ============================================================ */
function clientJoin(code, name) {
  CL.code = code.trim().toUpperCase(); CL.name = name.trim().slice(0, 20);
  CL.err = ""; CL.joined = false;
  if (!/^[A-Z]{4}$/.test(CL.code)) { CL.err = "Enter the 4-letter room code."; renderClient(); return; }
  if (!CL.name) { CL.err = "Enter your name."; renderClient(); return; }
  CL.role = "student"; CL.view = null;
  renderClient();
  const peer = new Peer(PEER_OPTS);
  CL.peer = peer;
  const timeout = setTimeout(() => { if (!CL.joined) { CL.err = "Could not reach the room. Check the code and try again."; try { peer.destroy(); } catch (e) {} CL.peer = null; renderClient(); } }, 20000);
  peer.on("error", () => { CL.err = "Could not connect. Check the code and try again."; CL.peer = null; renderClient(); });
  peer.on("open", () => {
    const conn = peer.connect(PREFIX + CL.code.toLowerCase(), { reliable: true });
    CL.conn = conn;
    conn.on("open", () => { CL.joined = true; clearTimeout(timeout); conn.send({ t: "join", name: CL.name }); renderClient(); });
    conn.on("data", m => {
      if (m && m.t === "view") {
        const prevRound = CL.view ? CL.view.round + ":" + CL.view.phase : "";
        CL.view = m.v;
        if (m.v.remaining !== undefined) CL.deadline = Date.now() + m.v.remaining;
        if (prevRound !== m.v.round + ":" + m.v.phase) CL.localVote = null;
        renderClient();
      }
    });
    conn.on("close", () => { CL.err = "The host closed the room."; CL.joined = false; renderClient(); });
  });
}
function clientVote(i) {
  if (!CL.conn || !CL.view) return;
  CL.localVote = { round: CL.view.round, opt: i };
  CL.conn.send({ t: "vote", round: CL.view.round, opt: i });
  renderClient();
}
function clientWords() {
  if (!CL.conn) return;
  const right = (document.getElementById("w-right") || {}).value || "";
  const wrong = (document.getElementById("w-wrong") || {}).value || "";
  CL.conn.send({ t: "words", right, wrong });
  CL.view = Object.assign({}, CL.view, { mySubmitted: true });
  renderClient();
}
function renderClient() {
  const app = document.getElementById("app");
  if (CL.role !== "student") return;
  if (!CL.joined) {
    const busy = !!CL.peer && !CL.err && CL.role === "student";
    app.innerHTML = `<h1>Join the room</h1>
      <div class="box">
      <p>Room code (from the projector):</p><input id="j-code" maxlength="4" autocapitalize="characters" value="${esc(CL.code)}" placeholder="ABCD">
      <p>Your name:</p><input id="j-name" maxlength="20" value="${esc(CL.name)}" placeholder="Name">
      <p><button id="j-go" ${busy ? "disabled" : ""}>${busy ? "Connecting…" : "Join"}</button></p>
      ${CL.err ? `<p class="err">${esc(CL.err)}</p>` : ""}</div>`;
    document.getElementById("j-go").onclick = () => clientJoin(document.getElementById("j-code").value, document.getElementById("j-name").value);
    return;
  }
  const v = CL.view;
  let html = `<div class="row"><h1>Case 8 · ${esc(CL.name)}</h1><span class="tag">Room ${esc(CL.code)}</span></div>`;
  if (!v || v.phase === "lobby") {
    html += `<div class="box"><p class="big">You are in the room.</p><p>Wait for the host to start the case.</p></div>`;
  } else if (v.phase === "brief") {
    html += `<div class="box"><p class="big">The case starts soon.</p><p>Watch the projector. Vote on each decision on this phone.</p></div>`;
  } else if (v.phase === "vote") {
    const sel = CL.localVote && CL.localVote.round === v.round ? CL.localVote.opt : v.myVote;
    html += `<div class="row"><span class="tag">Decision ${v.round + 1} of ${v.total}</span><span class="timer" id="timer">${Math.ceil(Math.max(0, CL.deadline - Date.now()) / 1000)}</span></div>
      <h2>${esc(v.title)}</h2><p class="big">${esc(v.prompt)}</p>
      <div class="opts">${v.options.map((o, i) => `<button class="opt ${sel === i ? "sel" : ""}" style="background:${COLORS[i]}" data-i="${i}">${shapeSVG(i)}<span>${esc(o)}</span></button>`).join("")}</div>
      <p class="muted">${sel === null || sel === undefined ? "Tap one answer." : "Vote sent. You can change it until the timer ends."}</p>`;
  } else if (v.phase === "result") {
    const r = v.result;
    const mine = v.myVote === null || v.myVote === undefined ? "You did not vote." : (v.myVote === r.winner ? "Your vote was chosen." : "Your vote was not chosen.");
    html += `<h2>${esc(v.title)}</h2>
      <div class="box"><p>The class chose:</p><p class="big">${esc(r.label)}</p>
      <p>${esc(r.reaction)}</p><p class="muted">${mine}</p></div>
      <p class="muted">Wait for the next decision.</p>`;
  } else if (v.phase === "reflect") {
    if (v.mySubmitted) {
      html += `<div class="box"><p class="big">Thanks.</p><p>Your words are on the projector.</p></div>`;
    } else {
      html += `<h2>Reflection</h2>
        <div class="box"><p><b>One word:</b> what went RIGHT in these decisions?</p><input id="w-right" maxlength="20" placeholder="one word">
        <p><b>One word:</b> what went WRONG?</p><input id="w-wrong" maxlength="20" placeholder="one word">
        <p><button id="w-send">Send my words</button></p></div>`;
    }
  } else if (v.phase === "end") {
    html += `<div class="box"><p class="big">${esc(v.ending)}</p>${meterBars(v.meters)}</div>${SUMMARY_HTML}`;
  }
  app.innerHTML = html;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => clientVote(Number(b.dataset.i)));
  const ws = document.getElementById("w-send");
  if (ws) ws.onclick = clientWords;
}

/* ============================================================
   START + TIMERS
   ============================================================ */
function $(s) { return document.querySelector(s); }
setInterval(() => {
  const el = document.getElementById("timer");
  if (H.role === "host" && H.phase === "vote" && H.code) {
    if (el) el.textContent = Math.ceil(Math.max(0, H.deadline - Date.now()) / 1000);
    if (Date.now() >= H.deadline) closeVote();
  }
  if (CL.role === "student" && CL.view && CL.view.phase === "vote" && el) {
    el.textContent = Math.ceil(Math.max(0, CL.deadline - Date.now()) / 1000);
  }
}, 250);

function startScreen() {
  const app = document.getElementById("app");
  app.innerHTML = `<h1>Case 8: Local and International?</h1>
    <div class="box"><p>A classroom vote game. The host runs the projector. Students join on phones.</p>
    <p><button id="s-host">Host on the projector</button></p>
    <p><button id="s-join">Join on a phone</button></p></div>`;
  document.getElementById("s-host").onclick = () => { H.role = "host"; H.code = newCode(); hostStart(H.code); renderHost(); };
  document.getElementById("s-join").onclick = () => { CL.role = "student"; CL.joined = false; renderClient(); };
}
startScreen();
</script>
